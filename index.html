<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime Ranking</title>

  <!-- Biblioteka do generowania pliku graficznego -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #f7f7f7;
      --text: #111111;
      --surface: #ffffff;
      --border: #e2e2e2;
      --border-input: #bbbbbb;
      --muted: #666666;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --btn-secondary: #555555;
      --link: #0066cc;
      --card-shadow: rgba(0, 0, 0, 0.08);
      --thumb-bg: #dddddd;
      --progress-bg: #e2e2e2;
      --progress-bar: #2563eb;
      
      --badge-airing-bg: #16a34a;
      --badge-airing-text: #ffffff;
      --badge-finished-bg: #64748b;
      --badge-finished-text: #ffffff;
    }

    body.dark {
      --bg: #121214;
      --text: #e4e4e7;
      --surface: #1e1e24;
      --border: #2e2e38;
      --border-input: #444450;
      --muted: #a1a1aa;
      --btn-bg: #e4e4e7;
      --btn-text: #121214;
      --btn-secondary: #3f3f46;
      --link: #60a5fa;
      --card-shadow: rgba(0, 0, 0, 0.4);
      --thumb-bg: #2d2d38;
      --progress-bg: #2e2e38;
      --progress-bar: #3b82f6;

      --badge-airing-bg: #22c55e;
      --badge-airing-text: #052e16;
      --badge-finished-bg: #3f3f46;
      --badge-finished-text: #e4e4e7;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }

    .header-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .import-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .import-box select,
    .import-box input {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-input);
      background: var(--bg);
      color: var(--text);
    }

    .import-box input {
      flex: 1;
      min-width: 200px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-input);
      resize: vertical;
      background: var(--surface);
      color: var(--text);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 15px;
      transition: opacity 0.15s;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--btn-secondary);
      color: #fff;
    }

    button.danger {
      background: #b91c1c;
      color: #fff;
    }

    #langToggleBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: bold;
      padding: 9px 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      margin: 10px 0;
      font-weight: 700;
      min-height: 22px;
    }

    .error {
      color: #ef4444;
      font-weight: 700;
      margin: 10px 0;
      white-space: pre-wrap;
    }

    .hidden,
    [hidden] {
      display: none !important;
    }

    .entry-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .entry-thumb {
      width: 56px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--thumb-bg);
      flex: 0 0 auto;
    }

    .entry-title {
      font-weight: 700;
    }

    .entry-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .progress-container {
      width: 100%;
      background: var(--progress-bg);
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
      margin: 14px 0 8px 0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--progress-bar);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .tie-container {
      display: flex;
      justify-content: center;
      margin: 16px 0 10px 0;
    }

    .cards {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: stretch;
      margin-top: 10px;
    }

    .card {
      width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--card-shadow);
    }

    .card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--thumb-bg);
    }

    .vs {
      align-self: center;
      font-size: 30px;
      font-weight: 900;
    }

    #rankingExportArea {
      padding: 8px 0;
    }

    .ranking-item {
      display: flex;
      gap: 14px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .ranking-item img {
      width: 56px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--thumb-bg);
    }

    .rank-number {
      width: 38px;
      font-weight: 900;
      font-size: 18px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .badge-status {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.3;
    }

    .badge-airing {
      background: var(--badge-airing-bg);
      color: var(--badge-airing-text);
    }

    .badge-finished {
      background: var(--badge-finished-bg);
      color: var(--badge-finished-text);
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 32px var(--card-shadow);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .candidate-card {
      display: flex;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      background: var(--surface);
      transition: border-color 0.15s, transform 0.1s;
    }

    .candidate-card:hover {
      border-color: var(--progress-bar);
      transform: translateY(-2px);
    }

    .candidate-card img {
      width: 50px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--thumb-bg);
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="header-container">
    <button id="langToggleBtn" class="secondary" type="button" title="Zmień język / Change language"></button>
    <button id="themeToggleBtn" class="secondary" type="button">🌙 Dark Theme</button>
  </div>

  <section id="setup">
    <h1 id="t_mainTitle">Anime Ranking</h1>

    <p id="t_mainSubtitle">
      Paste a list of anime titles or import your watchlist directly from MyAnimeList, AniList, or Kitsu.
    </p>

    <!-- Unified Watchlist Import Box -->
    <div class="import-box">
      <strong id="t_importBoxLabel">Import Watchlist:</strong>
      <select id="importServiceSelect">
        <option value="mal">MyAnimeList</option>
        <option value="anilist">AniList</option>
        <option value="kitsu">Kitsu</option>
      </select>
      <input type="text" id="usernameInput" placeholder="Enter username..." />
      <button id="importWatchlistBtn" class="secondary">📥 Import Watching</button>
    </div>

    <label for="titlesInput" id="t_inputLabel">
      Anime titles — one title per line:
    </label>

    <textarea
      id="titlesInput"
      rows="8"
      placeholder="Frieren: Beyond Journey's End
BLEACH: Sennen Kessen-hen
Kingdom
Made in Abyss"
    ></textarea>

    <div class="controls">
      <button id="addBtn">Add titles</button>
      <button id="fetchCoversBtn" class="secondary">Fetch covers</button>
      <button id="clearCoverCacheBtn" class="secondary">Clear cover cache</button>
      <button id="clearListBtn" class="danger">Clear list</button>
      <button id="startBtn" disabled>Start sorting</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="errorBox" class="error hidden"></div>
    <div id="entriesMeta" class="muted"></div>

    <div id="entryList"></div>
  </section>

  <section id="compareView" class="hidden">
    <h2 id="t_compareTitle">Which anime is better?</h2>
    
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="compareCounter" class="muted"></div>

    <div class="controls">
      <button id="cancelCompareBtn" class="danger">Cancel and return to list</button>
    </div>

    <div class="tie-container">
      <button id="tieBtn" class="secondary" style="font-size: 16px; font-weight: bold; padding: 12px 24px;">
        🤝 Tie (both are equally good)
      </button>
    </div>

    <div class="cards" id="compareCards">
      <div class="card" id="cardA"></div>
      <div class="vs">VS</div>
      <div class="card" id="cardB"></div>
    </div>
  </section>

  <section id="resultView" class="hidden">
    <div class="controls">
      <button id="exportImageBtn" class="secondary">📸 Download ranking as image (PNG)</button>
      <button id="uploadLitterboxBtn" class="secondary">☁️ Upload to Litterbox (link)</button>
      <button id="compareAgainBtn">Sort again</button>
      <button id="backFromResultBtn" class="secondary">Return to list</button>
    </div>

    <div id="uploadResult"></div>

    <div id="rankingExportArea">
      <h2 id="t_resultTitle">Your Ranking</h2>
      <div id="rankList"></div>
    </div>
  </section>

  <!-- Modal wyboru sezonu -->
  <div id="disambiguationModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="t_modalTitle" style="margin: 0;">Select Season</h3>
        <button id="closeModalBtn" class="secondary" style="padding: 6px 12px;">✕</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: 8px;">
          <input
            type="text"
            id="modalSearchInput"
            style="flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--surface); color: var(--text);"
            placeholder="Search specific title..."
          />
          <button id="modalSearchBtn" class="secondary">Search</button>
        </div>
        <div id="modalLoading" class="muted" style="margin-top: 10px; display: none;">Loading candidates...</div>
        <div id="candidateGrid" class="candidate-grid"></div>
      </div>
    </div>
  </div>

      /* Unified Watchlist Importer (MAL, AniList, Kitsu) */
      async function importUserWatchlist() {
        const t = translations[currentLang];
        const service = importServiceSelect.value;
        const username = usernameInput.value.trim();

        if (!username) {
          setStatus(t.userPrompt);
          return;
        }

        const serviceNames = { mal: 'MyAnimeList', anilist: 'AniList', kitsu: 'Kitsu' };
        const serviceName = serviceNames[service] || service;

        setError('');
        setStatus(t.importLoading(serviceName));
        importWatchlistBtn.disabled = true;

        let titles = [];

        try {
          if (service === 'anilist') {
            titles = await fetchAnilistWatching(username);
          } else if (service === 'kitsu') {
            titles = await fetchKitsuWatching(username);
          } else {
            titles = await fetchMalWatching(username);
          }
        } catch (err) {
          console.error(`Import error (${service}):`, err);
        }

        importWatchlistBtn.disabled = false;

        if (!titles || !titles.length) {
          setError(t.importError(serviceName));
          setStatus('');
          return;
        }

        let added = 0;
        for (const name of titles) {
          const isDuplicate = entries.some(
            (entry) => normalizeTitle(entry.name) === normalizeTitle(name)
          );
          if (!isDuplicate) {
            entries.push(createEntry(name));
            added += 1;
          }
        }

        saveEntries();
        renderEntries();
        updateControls();

        if (added > 0) {
          setStatus(t.importSuccess(added, serviceName, username));
          fetchAllCovers();
        } else {
          setStatus(t.noNewTitles);
        }
      }

      async function fetchAnilistWatching(username) {
        const query = `
          query ($userName: String) {
            MediaListCollection(userName: $userName, type: ANIME, status: CURRENT) {
              lists {
                entries {
                  media {
                    title {
                      romaji
                      english
                    }
                  }
                }
              }
            }
          }
        `;

        const res = await fetchWithTimeout('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query, variables: { userName: username } })
        }, 9000);

        if (!res.ok) throw new Error('AniList request failed.');
        const json = await res.json();
        const lists = json?.data?.MediaListCollection?.lists || [];
        const titles = [];

        for (const list of lists) {
          for (const entry of (list.entries || [])) {
            const title = entry.media?.title?.romaji || entry.media?.title?.english;
            if (title) titles.push(title);
          }
        }
        return titles;
      }

      async function fetchKitsuWatching(username) {
        const userRes = await fetchWithTimeout(`https://kitsu.io/api/edge/users?filter[name]=${encodeURIComponent(username)}`, {
          headers: { 'Accept': 'application/vnd.api+json' }
        }, 9000);

        if (!userRes.ok) throw new Error('Kitsu user request failed.');
        const userJson = await userRes.json();
        const userId = userJson?.data?.[0]?.id;
        if (!userId) throw new Error('Kitsu user not found.');

        const entriesUrl = `https://kitsu.io/api/edge/library-entries?filter[userId]=${userId}&filter[status]=current&filter[kind]=anime&include=anime&page[limit]=50`;
        const entriesRes = await fetchWithTimeout(entriesUrl, {
          headers: { 'Accept': 'application/vnd.api+json' }
        }, 9000);

        if (!entriesRes.ok) throw new Error('Kitsu library request failed.');
        const entriesJson = await entriesRes.json();
        const included = entriesJson?.included || [];
        const animeMap = {};

        for (const inc of included) {
          if (inc.type === 'anime') {
            animeMap[inc.id] = inc.attributes?.canonicalTitle || inc.attributes?.titles?.en || inc.attributes?.titles?.en_jp;
          }
        }

        const titles = [];
        for (const item of (entriesJson.data || [])) {
          const animeId = item.relationships?.anime?.data?.id;
          if (animeId && animeMap[animeId]) {
            titles.push(animeMap[animeId]);
          }
        }
        return titles;
      }

      async function fetchMalWatching(username) {
        const malUrl = `https://myanimelist.net/animelist/${encodeURIComponent(username)}/load.json?status=1`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(malUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(malUrl)}`
        ];

        for (const proxyUrl of proxies) {
          try {
            const res = await fetchWithTimeout(proxyUrl, {}, 9000);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data)) {
                return data.map((item) => item.anime_title || item.anime_title_eng).filter(Boolean);
              }
            }
          } catch (e) {}
        }
        throw new Error('MAL request failed.');
      }

      async function convertImgToBase64(imgUrl) {
        if (!imgUrl || imgUrl.startsWith('data:')) return imgUrl;

        const blobToDataURL = (blob) =>
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });

        const cleanUrl = imgUrl.replace(/^https?:\/\//, '');

        const sourcesToTry = [
          `https://i0.wp.com/${cleanUrl}`,
          `https://i1.wp.com/${cleanUrl}`,
          `https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&refresh=2592000&url=${encodeURIComponent(imgUrl)}`,
          `https://wsrv.nl/?url=${encodeURIComponent(imgUrl)}&output=jpg`,
          imgUrl
        ];

        for (const url of sourcesToTry) {
          try {
            const res = await fetchWithTimeout(url, { mode: 'cors' }, 5000);
            if (res.ok) {
              const blob = await res.blob();
              if (blob && blob.size > 200) {
                const dataUrl = await blobToDataURL(blob);
                if (dataUrl && dataUrl.startsWith('data:image')) {
                  return dataUrl;
                }
              }
            }
          } catch (e) {}
        }

        return imgUrl;
      }

      async function prepareImagesForCanvas() {
        const imgElements = Array.from(rankingExportArea.querySelectorAll('img'));
        const originalSources = imgElements.map((img) => img.src);

        await Promise.all(
          imgElements.map(async (img) => {
            if (img.src && !img.src.startsWith('data:')) {
              const base64 = await convertImgToBase64(img.src);
              if (base64 && base64.startsWith('data:image')) {
                img.src = base64;
              }
            }
          })
        );

        await Promise.all(
          imgElements.map(
            (img) =>
              new Promise((resolve) => {
                if (img.complete && img.naturalHeight !== 0) {
                  if (img.decode) img.decode().then(resolve).catch(resolve);
                  else resolve();
                } else {
                  img.onload = () => {
                    if (img.decode) img.decode().then(resolve).catch(resolve);
                    else resolve();
                  };
                  img.onerror = resolve;
                }
              })
          )
        );

        await sleep(250);
        return { imgElements, originalSources };
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);

      function createEntry(name) {
        return {
          id: uid(),
          name: name.trim(),
          coverUrl: '',
          infoUrl: anilistSearchUrl(name.trim()),
          status: 'pending',
          matchedTitle: '',
          source: '',
          anilistScore: '',
          kitsuScore: '',
          animeStatus: '',
          candidates: []
        };

      function normalizeTitle(value = '') {
        return String(value)
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim()
          .replace(/[^\p{L}\p{N}\s]/gu, ' ')
          .replace(/\s+/g, ' ');
      }

      function getSearchQueries(rawTitle) {
        const queries = [];
        const add = (q) => {
          const trimmed = q?.trim();
          if (trimmed && trimmed.length >= 2 && !queries.includes(trimmed)) {
            queries.push(trimmed);
          }
        };

        add(rawTitle);

        const noAccents = rawTitle.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        add(noAccents);

        const noSeason = noAccents
          .replace(/\b(\d+(st|nd|rd|th)?\s+season|season\s+\d+|part\s+\d+|cour\s+\d+)\b/gi, ' ')
          .replace(/\s+/g, ' ');
        add(noSeason);

        const beforePunct = noAccents.split(/[:\-\~|/()\[\]]/)[0];
        add(beforePunct);

        const clean = noAccents.replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ');
        add(clean);

        const words = clean.split(' ').filter(Boolean);
        if (words.length > 3) {
          add(words.slice(0, 3).join(' '));
        }

        return queries;
      }

        const lines = raw
          .split(/\r?\n/)
          .flatMap((line) => line.split(';'))
          .map((line) => line.trim())
          .filter(Boolean);

        let added = 0;

        for (const name of lines) {
          const isDuplicate = entries.some(
            (entry) => normalizeTitle(entry.name) === normalizeTitle(name)
          );

          if (!isDuplicate) {
            entries.push(createEntry(name));
            added += 1;
          }
        }

        titlesInput.value = '';

        saveEntries();
        renderEntries();
        updateControls();

        if (added > 0) {
          if (isFetching) {
            setStatus(t.addedFetchingRunning(added));
          } else {
            setStatus(t.addedFetching(added));
            fetchAllCovers();
          }
        } else {
          setStatus(t.noNewTitles);
        }
      }

      async function fetchAllCovers() {
        const t = translations[currentLang];
        if (isFetching) return;

        if (!entries.length) {
          setStatus(t.pastePrompt);
          return;
        }

        const missing = entries.filter((entry) => entry.status !== 'ok');

        if (!missing.length) {
          setStatus(t.allCoversFetched);
          return;
        }

        isFetching = true;
        updateControls();
        setError('');
        setStatus(t.fetchStarted);

        for (const entry of entries) {
          if (entry.status === 'ok') continue;

          entry.status = 'loading';
          renderEntries();
          updateControls();

          try {
            const result = await getCoverForTitle(entry.name);

            entry.coverUrl = result.coverUrl || '';
            entry.infoUrl = result.infoUrl || anilistSearchUrl(entry.name);
            entry.matchedTitle = result.matchedTitle || '';
            entry.source = result.source || '';
            entry.anilistScore = result.anilistScore || '';
            entry.kitsuScore = result.kitsuScore || '';
            entry.animeStatus = result.animeStatus || '';
            entry.candidates = result.candidates || [];
            entry.status = 'ok';
          } catch (err) {
            console.warn(`Failed to fetch cover: ${entry.name}`, err);

            entry.coverUrl = '';
            entry.status = 'error';
            entry.infoUrl = entry.infoUrl || anilistSearchUrl(entry.name);
          }

          saveEntries();
          renderEntries();

          await sleep(120);
        }

        isFetching = false;
        updateControls();
        renderEntries();
        setStatus(t.fetchFinished);
      }

      async function getCoverForTitle(title) {
        const cached = readCoverCache(title);

        if (cached && (cached.coverUrl || cached.anilistScore || cached.kitsuScore)) {
          return cached;
        }

        let coverUrl = '';
        let infoUrl = '';
        let matchedTitle = '';
        let source = '';
        let anilistScore = '';
        let kitsuScore = '';
        let animeStatus = '';
        let candidates = [];
        const errors = [];

        // 1. AniList
        try {
          const anilistResult = await fetchAnilistCandidates(title);
          if (anilistResult.candidates && anilistResult.candidates.length) {
            candidates = anilistResult.candidates;
            const topCandidate = candidates[0];

            coverUrl = topCandidate.coverUrl;
            infoUrl = topCandidate.infoUrl;
            matchedTitle = topCandidate.title;
            animeStatus = topCandidate.animeStatus;
            source = 'AniList';
            if (topCandidate.score) anilistScore = topCandidate.score;
          }
        } catch (err) {
          errors.push('AniList: ' + (err?.message || err));
        }

        // 2. Kitsu
        try {
          const kitsuResult = await fetchKitsuData(matchedTitle || title);
          if (!coverUrl && kitsuResult.coverUrl) {
            coverUrl = kitsuResult.coverUrl;
            source = 'Kitsu';
            if (kitsuResult.matchedTitle) matchedTitle = kitsuResult.matchedTitle;
            if (kitsuResult.animeStatus) animeStatus = kitsuResult.animeStatus;
          }
          if (!infoUrl) infoUrl = kitsuResult.infoUrl;
          if (!matchedTitle) matchedTitle = kitsuResult.matchedTitle;
          if (!animeStatus && kitsuResult.animeStatus) animeStatus = kitsuResult.animeStatus;
          if (kitsuResult.score) kitsuScore = kitsuResult.score;

          if (!candidates.length && kitsuResult.candidates) {
            candidates = kitsuResult.candidates;
          }
        } catch (err) {
          errors.push('Kitsu: ' + (err?.message || err));
        }

        if (!coverUrl && !matchedTitle && !anilistScore && !kitsuScore) {
          throw new Error(errors.join(' | '));
        }

        const result = {
          coverUrl,
          infoUrl: infoUrl || anilistSearchUrl(title),
          matchedTitle: matchedTitle || title,
          source: source || (anilistScore ? 'AniList' : kitsuScore ? 'Kitsu' : ''),
          anilistScore,
          kitsuScore,
          animeStatus,
          candidates
        };

        writeCoverCache(title, result);
        return result;
      }

      async function fetchAnilistCandidates(title) {
        const queries = getSearchQueries(title);
        let lastError = null;

        for (const q of queries.slice(0, 3)) {
          try {
            const query = `
              query ($search: String) {
                Page(page: 1, perPage: 12) {
                  media(search: $search, type: ANIME, sort: [SEARCH_MATCH, POPULARITY_DESC]) {
                    id
                    siteUrl
                    status
                    seasonYear
                    startDate { year }
                    format
                    episodes
                    averageScore
                    meanScore
                    title {
                      romaji
                      english
                      native
                    }
                    coverImage {
                      large
                      medium
                    }
                  }
                }
              }
            `;

            const res = await fetchWithTimeout('https://graphql.anilist.co', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                query,
                variables: { search: q }
              })
            });

            if (!res.ok) continue;

            const json = await res.json();
            const mediaList = json?.data?.Page?.media || [];

            const filteredMedia = mediaList.filter((m) => m.status !== 'NOT_YET_RELEASED');
            if (!filteredMedia.length) continue;

            const mapped = filteredMedia.map((m) => {
              const scoreVal = m.averageScore || m.meanScore;
              return {
                id: m.id,
                title: m.title?.romaji || m.title?.english || m.title?.native || title,
                englishTitle: m.title?.english || '',
                coverUrl: m.coverImage?.large || m.coverImage?.medium || '',
                infoUrl: m.siteUrl || anilistSearchUrl(title),
                animeStatus: m.status || 'FINISHED',
                year: m.seasonYear || m.startDate?.year || '',
                format: m.format || 'TV',
                score: scoreVal ? `${scoreVal}%` : ''
              };
            });

            mapped.sort((a, b) => {
              const aAiring = a.animeStatus === 'RELEASING' ? 1 : 0;
              const bAiring = b.animeStatus === 'RELEASING' ? 1 : 0;
              if (aAiring !== bAiring) return bAiring - aAiring;
              return (Number(b.year) || 0) - (Number(a.year) || 0);
            });

            return { candidates: mapped };
          } catch (err) {
            lastError = err;
          }
        }

        throw lastError || new Error('No results on AniList.');
      }

      async function fetchKitsuData(title) {
        const queries = getSearchQueries(title);
        let lastError = null;

        for (const q of queries.slice(0, 3)) {
          try {
            const params = new URLSearchParams({
              'filter[text]': q,
              'page[limit]': '12'
            });

            const url = `https://kitsu.io/api/edge/anime?${params.toString()}`;
            const res = await fetchWithTimeout(url, {
              headers: { 'Accept': 'application/vnd.api+json' }
            });

            if (!res.ok) continue;

            const json = await res.json();
            const list = Array.isArray(json.data) ? json.data : [];
            if (!list.length) continue;

            const filteredList = list.filter((item) => {
              const rawStatus = (item.attributes?.status || '').toLowerCase();
              return !['upcoming', 'tba', 'unreleased'].includes(rawStatus);
            });

            if (!filteredList.length) continue;

            const candidates = filteredList.map((item) => {
              const attrs = item.attributes || {};
              const rawStatus = attrs.status;
              const animeStatus = rawStatus === 'current' ? 'RELEASING' : 'FINISHED';

              const coverUrl =
                attrs.posterImage?.original ||
                attrs.posterImage?.large ||
                attrs.posterImage?.medium ||
                attrs.posterImage?.small ||
                attrs.posterImage?.tiny ||
                '';

              const matchedTitle =
                attrs.canonicalTitle ||
                attrs.titles?.en ||
                attrs.titles?.en_jp ||
                title;

              const infoUrl = attrs.slug
                ? `https://kitsu.io/anime/${attrs.slug}`
                : `https://kitsu.io/anime?text=${encodeURIComponent(title)}`;

              let score = '';
              if (attrs.averageRating && !isNaN(attrs.averageRating)) {
                score = `${Math.round(Number(attrs.averageRating))}%`;
              }

              const year = attrs.startDate ? attrs.startDate.slice(0, 4) : '';

              return {
                id: item.id,
                coverUrl,
                infoUrl,
                title: matchedTitle,
                animeStatus,
                status: rawStatus,
                year,
                format: attrs.subtype ? attrs.subtype.toUpperCase() : 'TV',
                score
              };
            });

            candidates.sort((a, b) => {
              const aAiring = a.animeStatus === 'RELEASING' ? 1 : 0;
              const bAiring = b.animeStatus === 'RELEASING' ? 1 : 0;
              if (aAiring !== bAiring) return bAiring - aAiring;
              return (Number(b.year) || 0) - (Number(a.year) || 0);
            });

            const best = candidates[0];

            return {
              coverUrl: best.coverUrl,
              infoUrl: best.infoUrl,
              matchedTitle: best.title,
              animeStatus: best.animeStatus,
              score: best.score,
              candidates
            };
          } catch (err) {
            lastError = err;
          }
        }

        throw lastError || new Error('No results on Kitsu.');
      }

      async function fetchWithTimeout(url, options = {}, timeout = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);

        try {
          return await fetch(url, {
            ...options,
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeoutId);
        }
      }

      /* Modal Disambiguation Handlers */
      async function openDisambiguationModal(entry) {
        activeDisambiguationEntry = entry;
        modalSearchInput.value = entry.name;
        disambiguationModal.classList.remove('hidden');
        renderCandidates(entry.candidates || []);

        if (!entry.candidates || !entry.candidates.length) {
          await searchModalQuery();
        }
      }

      function closeDisambiguationModal() {
        activeDisambiguationEntry = null;
        disambiguationModal.classList.add('hidden');
      }

      async function searchModalQuery() {
        const q = modalSearchInput.value.trim();
        if (!q) return;

        modalLoading.style.display = 'block';
        modalLoading.textContent = translations[currentLang].modalLoading;
        candidateGrid.innerHTML = '';

        try {
          const res = await fetchAnilistCandidates(q);
          renderCandidates(res.candidates || []);
        } catch (e) {
          try {
            const kitsuRes = await fetchKitsuData(q);
            renderCandidates(kitsuRes.candidates || []);
          } catch (err) {
            candidateGrid.innerHTML = `<div class="muted">No results found.</div>`;
          }
        } finally {
          modalLoading.style.display = 'none';
        }
      }

      function renderCandidates(list) {
        candidateGrid.innerHTML = '';

        if (!list || !list.length) {
          candidateGrid.innerHTML = `<div class="muted">No candidates available. Try searching above.</div>`;
          return;
        }

        list.forEach((candidate) => {
          const card = document.createElement('div');
          card.className = 'candidate-card';

          const badgeHtml = getAnimeStatusBadge(candidate.animeStatus || candidate.status);
          const metaYearFormat = [candidate.year, candidate.format].filter(Boolean).join(' • ');

          card.innerHTML = `
            <img src="${escapeHtml(candidate.coverUrl || getPlaceholderCover())}" alt="" />
            <div style="flex: 1; font-size: 13px;">
              <strong style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(candidate.title)}</strong>
              <div class="muted" style="margin-top: 2px;">${escapeHtml(metaYearFormat)}</div>
              ${candidate.score ? `<div class="muted">★ ${escapeHtml(candidate.score)}</div>` : ''}
              <div style="margin-top: 4px;">${badgeHtml}</div>
            </div>
          `;

          card.addEventListener('click', async () => {
            if (!activeDisambiguationEntry) return;

            activeDisambiguationEntry.coverUrl = candidate.coverUrl;
            activeDisambiguationEntry.matchedTitle = candidate.title;
            activeDisambiguationEntry.anilistScore = candidate.score || '';
            activeDisambiguationEntry.infoUrl = candidate.infoUrl;
            activeDisambiguationEntry.animeStatus = candidate.animeStatus || candidate.status || 'FINISHED';
            activeDisambiguationEntry.source = 'AniList';
            activeDisambiguationEntry.status = 'ok';

            try {
              const kitsuRes = await fetchKitsuData(candidate.title);
              if (kitsuRes && kitsuRes.score) {
                activeDisambiguationEntry.kitsuScore = kitsuRes.score;
              }
            } catch (e) {}

            saveEntries();
            renderEntries();
            closeDisambiguationModal();
          });

          candidateGrid.appendChild(card);
        });
      }

      function coverCacheKey(title) {
        return COVER_CACHE_PREFIX + normalizeTitle(title);
      }

      function readCoverCache(title) {
        try {
          const raw = localStorage.getItem(coverCacheKey(title));
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (err) {
          return null;
        }
      }

      function writeCoverCache(title, data) {
        try {
          localStorage.setItem(coverCacheKey(title), JSON.stringify(data));
        } catch (err) {}
      }

      function clearCoverCache() {
        const t = translations[currentLang];
        if (!entries.length) {
          setStatus(t.emptyCacheMsg);
          return;
        }

        const keysToRemove = [];
        try {
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (key && key.startsWith(COVER_CACHE_PREFIX)) {
              keysToRemove.push(key);
            }
          }
          for (const key of keysToRemove) {
            localStorage.removeItem(key);
          }
        } catch (err) {}

        entries = entries.map((entry) => ({
          ...entry,
          coverUrl: '',
          status: 'pending',
          matchedTitle: '',
          source: '',
          anilistScore: '',
          kitsuScore: '',
          animeStatus: '',
          candidates: [],
          infoUrl: anilistSearchUrl(entry.name)
        }));

        saveEntries();
        renderEntries();
        updateControls();
        setStatus(t.cacheCleared(keysToRemove.length));
      }

      function saveEntries() {
        try {
          const serialized = entries.map((entry) => ({
            ...entry,
            status: entry.status === 'loading' ? 'pending' : entry.status
          }));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serialized));
        } catch (err) {}
      }

      function loadEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return;

          entries = parsed
            .filter((item) => item && typeof item.name === 'string' && item.name.trim())
            .map((item) => ({
              id: String(item.id || uid()),
              name: item.name.trim(),
              coverUrl: typeof item.coverUrl === 'string' ? item.coverUrl : '',
              infoUrl: typeof item.infoUrl === 'string' && item.infoUrl ? item.infoUrl : anilistSearchUrl(item.name.trim()),
              status: item.status === 'ok' ? 'ok' : item.status === 'error' ? 'error' : 'pending',
              matchedTitle: typeof item.matchedTitle === 'string' ? item.matchedTitle : '',
              source: typeof item.source === 'string' ? item.source : '',
              anilistScore: typeof item.anilistScore === 'string' ? item.anilistScore : '',
              kitsuScore: typeof item.kitsuScore === 'string' ? item.kitsuScore : '',
              animeStatus: typeof item.animeStatus === 'string' ? item.animeStatus : '',
              candidates: Array.isArray(item.candidates) ? item.candidates : []
            }));
        } catch (err) {
          entries = [];
        }
      }

      function renderEntries() {
        const t = translations[currentLang];
        entryList.innerHTML = '';

        for (const entry of entries) {
          const row = document.createElement('div');
          row.className = 'entry-item';

          const displayTitle = entry.matchedTitle || entry.name;
          const statusBadge = getAnimeStatusBadge(entry.animeStatus);

          row.innerHTML = `
            <img class="entry-thumb" src="${escapeHtml(entry.coverUrl || getPlaceholderCover())}" alt="" />

            <div style="flex: 1; min-width: 0;">
              <div class="entry-title" style="word-break: break-word;">${escapeHtml(displayTitle)}</div>
              <div class="muted" style="margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                ${statusBadge}
                <span>${escapeHtml(statusLabel(entry.status))}${entry.source ? ' • ' + escapeHtml(entry.source) : ''}</span>
              </div>
            </div>

            <div class="entry-actions">
              <button class="secondary" data-disambig-id="${entry.id}" style="font-size: 13px; padding: 6px 10px;">${escapeHtml(t.changeVersionBtn)}</button>
              <a
                href="${escapeHtml(entry.infoUrl || anilistSearchUrl(displayTitle))}"
                target="_blank"
                rel="noopener"
                style="font-size: 14px;"
              >${escapeHtml(t.infoLink)}</a>
              <button class="danger" data-remove-id="${entry.id}" style="font-size: 13px; padding: 6px 10px;">${escapeHtml(t.removeBtn)}</button>
            </div>
          `;

          const img = row.querySelector('img');
          img.addEventListener('error', () => {
            img.src = getPlaceholderCover();
          });

          entryList.appendChild(row);
        }
      }

      function statusLabel(status) {
        const t = translations[currentLang];
        const labels = {
          pending: t.itemPending,
          loading: t.itemLoading,
          ok: t.itemOk,
          error: t.itemError
        };
        return labels[status] || status;
      }

      function updateControls() {
        const t = translations[currentLang];
        addBtn.disabled = false;
        fetchCoversBtn.disabled = isFetching || entries.length === 0;
        clearCoverCacheBtn.disabled = isFetching || entries.length === 0;
        clearListBtn.disabled = isFetching || entries.length === 0;
        startBtn.disabled = isFetching || entries.length < 2;

        const missingCovers = entries.filter((entry) => entry.status !== 'ok').length;

        if (!entries.length) {
          entriesMeta.textContent = t.emptyList;
          return;
        }

        entriesMeta.textContent =
          `${t.titleCount}${entries.length}` +
          (missingCovers ? `${t.missingCovers}${missingCovers}` : '');
      }

      function clearList() {
        const t = translations[currentLang];
        if (!entries.length) return;
        if (!confirm(t.clearConfirm)) return;

        entries = [];
        saveEntries();
        renderEntries();
        updateControls();
        setStatus(t.listCleared);
      }

      async function startRanking() {
        if (entries.length < 2) return;

        compareCancelled = false;
        compareCount = 0;
        setError('');
        setStatus('');
        progressBar.style.width = '0%';

        hideSection(setup);
        hideSection(resultView);
        showSection(compareView);

        try {
          const initialClusters = entries.map((entry) => [entry]);
          const rankedClusters = await mergeSort(initialClusters);

          lastRankedClusters = rankedClusters;
          progressBar.style.width = '100%';
          renderRanking(rankedClusters);

          hideSection(compareView);
          showSection(resultView);
        } catch (err) {
          if (err && err.name === 'CancelledError') {
            showSetup();
            return;
          }
          hideSection(compareView);
          showSection(setup);
          setError('Error during comparison: ' + (err?.message || err));
        }
      }

      function cancelCompare() {
        compareCancelled = true;
        if (resolveChoice) {
          const resolver = resolveChoice;
          resolveChoice = null;
          resolver(null);
        }
        showSetup();
      }

      function showSetup() {
        showSection(setup);
        hideSection(compareView);
        hideSection(resultView);
        setStatus('');
        setError('');
        updateControls();
      }

      async function mergeSort(clusters) {
        if (clusters.length <= 1) return clusters;
        const middle = Math.floor(clusters.length / 2);
        const left = await mergeSort(clusters.slice(0, middle));
        const right = await mergeSort(clusters.slice(middle));
        return merge(left, right);
      }

      async function merge(left, right) {
        const result = [];
        let i = 0;
        let j = 0;

        while (i < left.length && j < right.length) {
          if (compareCancelled) throw new CancelledError();

          const choice = await askCompare(left[i][0], right[j][0]);
          if (!choice) throw new CancelledError();

          if (choice === 'tie') {
            result.push([...left[i], ...right[j]]);
            i += 1;
            j += 1;
          } else if (choice.id === left[i][0].id) {
            result.push(left[i]);
            i += 1;
          } else {
            result.push(right[j]);
            j += 1;
          }
        }

        return result.concat(left.slice(i)).concat(right.slice(j));
      }

      function askCompare(a, b) {
        const t = translations[currentLang];
        currentA = a;
        currentB = b;
        compareCount += 1;

        const estimatedTotal = Math.max(1, Math.round(entries.length * Math.log2(entries.length)));
        const percent = Math.min(99, Math.round(((compareCount - 1) / estimatedTotal) * 100));

        progressBar.style.width = `${percent}%`;
        compareCounter.textContent = t.progressText(compareCount, percent, entries.length);

        renderCompareCard(cardA, a);
        renderCompareCard(cardB, b);

        return new Promise((resolve) => {
          resolveChoice = resolve;
        });
      }

      function renderCompareCard(card, entry) {
        const t = translations[currentLang];
        card.dataset.id = entry.id;

        const displayTitle = entry.matchedTitle || entry.name;

        card.innerHTML = `
          <img src="${escapeHtml(entry.coverUrl || getPlaceholderCover())}" alt="" />
          <h3 style="margin-top: 10px; margin-bottom: 6px; line-height: 1.3;">${escapeHtml(displayTitle)}</h3>
          <p class="muted" style="margin-top: 6px;">
            <a
              href="${escapeHtml(entry.infoUrl || anilistSearchUrl(displayTitle))}"
              target="_blank"
              rel="noopener"
            >${escapeHtml(t.infoLink)}</a>
          </p>
        `;

        const img = card.querySelector('img');
        img.addEventListener('error', () => {
          img.src = getPlaceholderCover();
        });
      }

      function renderRanking(clusters) {
        const t = translations[currentLang];
        rankList.innerHTML = '';
        let currentRank = 1;

        clusters.forEach((cluster) => {
          const rankForThisCluster = currentRank;

          cluster.forEach((entry) => {
            const row = document.createElement('div');
            row.className = 'ranking-item';

            const displayTitle = entry.matchedTitle || entry.name;

            const scoreBadges = [];
            if (entry.anilistScore) {
              scoreBadges.push(`AniList: ★ ${escapeHtml(entry.anilistScore)}`);
            }
            if (entry.kitsuScore) {
              scoreBadges.push(`Kitsu: ★ ${escapeHtml(entry.kitsuScore)}`);
            }

            const scoreText = scoreBadges.length ? ` • ${scoreBadges.join(' • ')}` : '';

            row.innerHTML = `
              <div class="rank-number">${rankForThisCluster}.</div>
              <img src="${escapeHtml(entry.coverUrl || getPlaceholderCover())}" alt="" />
              <div>
                <strong>${escapeHtml(displayTitle)}</strong>
                <div class="muted" style="margin-top: 4px;">
                  <a
                    href="${escapeHtml(entry.infoUrl || anilistSearchUrl(displayTitle))}"
                    target="_blank"
                    rel="noopener"
                  >${escapeHtml(t.infoLink)}</a>${scoreText}
                </div>
              </div>
            `;

            const img = row.querySelector('img');
            img.addEventListener('error', () => {
              img.src = getPlaceholderCover();
            });

            rankList.appendChild(row);
          });

          currentRank += cluster.length;
        });
      }

      function anilistSearchUrl(title) {
        return `https://anilist.co/search/anime?search=${encodeURIComponent(title)}`;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function escapeHtml(value = '') {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }
    })();
  </script>
