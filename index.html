<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime Ranking</title>

  <!-- Biblioteka do generowania pliku graficznego -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #f7f7f7;
      --text: #111111;
      --surface: #ffffff;
      --border: #e2e2e2;
      --border-input: #bbbbbb;
      --muted: #666666;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --btn-secondary: #555555;
      --link: #0066cc;
      --card-shadow: rgba(0, 0, 0, 0.08);
      --thumb-bg: #dddddd;
      --progress-bg: #e2e2e2;
      --progress-bar: #2563eb;
      
      --badge-airing-bg: #16a34a;
      --badge-airing-text: #ffffff;
      --badge-finished-bg: #64748b;
      --badge-finished-text: #ffffff;
      --badge-upcoming-bg: #d97706;
      --badge-upcoming-text: #ffffff;
    }

    body.dark {
      --bg: #121214;
      --text: #e4e4e7;
      --surface: #1e1e24;
      --border: #2e2e38;
      --border-input: #444450;
      --muted: #a1a1aa;
      --btn-bg: #e4e4e7;
      --btn-text: #121214;
      --btn-secondary: #3f3f46;
      --link: #60a5fa;
      --card-shadow: rgba(0, 0, 0, 0.4);
      --thumb-bg: #2d2d38;
      --progress-bg: #2e2e38;
      --progress-bar: #3b82f6;

      --badge-airing-bg: #22c55e;
      --badge-airing-text: #052e16;
      --badge-finished-bg: #3f3f46;
      --badge-finished-text: #e4e4e7;
      --badge-upcoming-bg: #f59e0b;
      --badge-upcoming-text: #451a03;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }

    .header-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .import-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .import-box select,
    .import-box input[type="text"],
    .import-box input[type="file"] {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-input);
      background: var(--bg);
      color: var(--text);
    }

    .import-box input[type="text"],
    .import-box input[type="file"] {
      flex: 1;
      min-width: 200px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-input);
      resize: vertical;
      background: var(--surface);
      color: var(--text);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 15px;
      transition: opacity 0.15s;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--btn-secondary);
      color: #fff;
    }

    button.danger {
      background: #b91c1c;
      color: #fff;
    }

    #langToggleBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: bold;
      padding: 9px 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      margin: 10px 0;
      font-weight: 700;
      min-height: 22px;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      margin: 12px 0;
      white-space: pre-wrap;
    }

    .hidden,
    [hidden] {
      display: none !important;
    }

    .entry-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .entry-thumb {
      width: 56px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--thumb-bg);
      flex: 0 0 auto;
    }

    .entry-title {
      font-weight: 700;
    }

    .entry-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .compare-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: fit-content;
      margin: 0 auto;
    }

    .tie-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 16px 0 10px 0;
    }

    .cards {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: stretch;
      margin-top: 10px;
    }

    .card {
      width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--card-shadow);
    }

    .card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--thumb-bg);
    }

    .vs {
      align-self: center;
      font-size: 30px;
      font-weight: 900;
    }

    #rankingExportArea {
      padding: 8px 0;
    }

    .ranking-item {
      display: flex;
      gap: 14px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .ranking-item img {
      width: 56px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--thumb-bg);
    }

    .rank-number {
      width: 38px;
      font-weight: 900;
      font-size: 18px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .badge-status {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.3;
    }

    .badge-airing {
      background: var(--badge-airing-bg);
      color: var(--badge-airing-text);
    }

    .badge-finished {
      background: var(--badge-finished-bg);
      color: var(--badge-finished-text);
    }

    .badge-upcoming {
      background: var(--badge-upcoming-bg);
      color: var(--badge-upcoming-text);
    }

    .scores-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 5px;
    }

    .score-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      line-height: 1.2;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
    }

    .score-mal {
      background: #2e51a2;
      color: #ffffff;
    }

    .score-anilist {
      background: #02a9ff;
      color: #ffffff;
    }

    .score-kitsu {
      background: #f75239;
      color: #ffffff;
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 32px var(--card-shadow);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .candidate-card {
      display: flex;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      background: var(--surface);
      transition: border-color 0.15s, transform 0.1s;
    }

    .candidate-card:hover {
      border-color: var(--progress-bar);
      transform: translateY(-2px);
    }

    .candidate-card img {
      width: 50px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--thumb-bg);
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="header-container">
    <button id="langToggleBtn" class="secondary" type="button" title="Zmień język / Change language"></button>
    <button id="themeToggleBtn" class="secondary" type="button">🌙 Dark Theme</button>
  </div>

  <section id="setup">
    <h1 id="t_mainTitle">Anime Ranking</h1>

    <p id="t_mainSubtitle">
      Paste a list of anime titles or import your watchlist directly from AniList, MyAnimeList, or Kitsu.
    </p>

    <!-- Watchlist Import Box -->
    <div class="import-box">
      <strong id="t_importBoxLabel">Import Watchlist:</strong>
      <select id="importServiceSelect">
        <option value="anilist">AniList</option>
        <option value="mal_api">MyAnimeList</option>
        <option value="kitsu">Kitsu</option>
        </select>
      <input type="text" id="usernameInput" placeholder="Enter username..." />
      <button id="importWatchlistBtn" class="secondary">📥 Import Watching</button>
    </div>

    <label for="titlesInput" id="t_inputLabel">
      Anime titles — one title per line:
    </label>

    <textarea
      id="titlesInput"
      rows="8"
      placeholder="Frieren: Beyond Journey's End
BLEACH: Sennen Kessen-hen
Kingdom
Made in Abyss"
    ></textarea>

    <div class="controls">
      <button id="addBtn">Add titles</button>
      <button id="fetchCoversBtn" class="secondary">Fetch covers</button>
      <button id="clearCoverCacheBtn" class="secondary">Clear cover cache</button>
      <button id="clearListBtn" class="danger">Clear list</button>
      <button id="startBtn" disabled>Start sorting</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="errorBox" class="error hidden"></div>
    <div id="entriesMeta" class="muted"></div>

    <div id="entryList"></div>
  </section>

  <section id="compareView" class="hidden">
    <h2 id="t_compareTitle">Which anime is better?</h2>
    
    <div id="compareCounter" class="muted" style="font-weight: bold; font-size: 16px; margin-bottom: 12px;"></div>

    <div class="controls">
      <button id="cancelCompareBtn" class="danger">Cancel and return to list</button>
    </div>

    <div class="compare-arena">
      <div class="tie-container">
        <button id="tieBtn" class="secondary" style="font-size: 16px; font-weight: bold; padding: 12px 24px;">
          🤝 Tie (both are equally good)
        </button>
      </div>

      <div class="cards" id="compareCards">
        <div class="card" id="cardA"></div>
        <div class="vs">VS</div>
        <div class="card" id="cardB"></div>
      </div>
    </div>
  </section>

  <section id="resultView" class="hidden">
    <div class="controls">
      <button id="exportImageBtn" class="secondary">📸 Download ranking as image (PNG)</button>
      <button id="uploadLitterboxBtn" class="secondary">☁️ Upload to Litterbox (link)</button>
      <button id="compareAgainBtn">Sort again</button>
      <button id="backFromResultBtn" class="secondary">Return to list</button>
    </div>

    <div id="uploadResult"></div>

    <div id="rankingExportArea">
      <h2 id="t_resultTitle">Your Ranking</h2>
      <div id="rankList"></div>
    </div>
  </section>

  <!-- Modal wyboru sezonu -->
  <div id="disambiguationModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="t_modalTitle" style="margin: 0;">Select Season</h3>
        <button id="closeModalBtn" class="secondary" style="padding: 6px 12px;">✕</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: 8px;">
          <input
            type="text"
            id="modalSearchInput"
            style="flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--surface); color: var(--text);"
            placeholder="Search specific title..."
          />
          <button id="modalSearchBtn" class="secondary">Search</button>
        </div>
        <div id="modalLoading" class="muted" style="margin-top: 10px; display: none;">Loading candidates...</div>
        <div id="candidateGrid" class="candidate-grid"></div>
      </div>
    </div>
  </div>

      const ANILIST_MEDIA_FIELDS = `
        id idMal siteUrl status seasonYear startDate { year } format episodes averageScore meanScore
        title { romaji english native } coverImage { extraLarge large }
      `;

      function mapAnilistCandidate(m, fallbackQuery = '') {
        const scoreVal = m.averageScore || m.meanScore;
        return {
          id: m.id,
          idMal: m.idMal ? parseInt(m.idMal, 10) : null,
          title: m.title?.romaji || m.title?.english || m.title?.native || fallbackQuery,
          englishTitle: m.title?.english || '',
          coverUrl: m.coverImage?.extraLarge || m.coverImage?.large || '',
          infoUrl: m.siteUrl || '',
          animeStatus: m.status || 'FINISHED',
          year: m.seasonYear || m.startDate?.year || '',
          format: m.format || 'TV',
          score: scoreVal ? `${scoreVal}%` : ''
        };
      }

      function sortCandidates(list, query) {
        const statusRank = (s) => (s === 'RELEASING' ? 2 : s === 'NOT_YET_RELEASED' ? 1 : 0);
        return list.sort((a, b) => {
          const matchDiff = scoreCandidateMatch(query, b.title) - scoreCandidateMatch(query, a.title);
          if (matchDiff !== 0) return matchDiff;
          const stDiff = statusRank(b.animeStatus || b.status) - statusRank(a.animeStatus || a.status);
          if (stDiff !== 0) return stDiff;
          return (Number(b.year) || 0) - (Number(a.year) || 0);
        });
      }

      async function fetchFirstMatch(titles, fetcher) {
        let fallback = null;
        for (const t of titles) {
          if (!t) continue;
          try {
            const res = await fetcher(t);
            if (res) {
              if (res.score || res.malScore) return res;
              if (!fallback) fallback = res;
            }
          } catch (e) {}
        }
        return fallback;
      }

      async function fetchMalApiWatchingDetailed(username) {
        const malUrl = `https://myanimelist.net/animelist/${encodeURIComponent(username)}/load.json?status=1`;

        const endpoints = [
          `https://proxy.cors.sh/${malUrl}`,
          `https://corsproxy.io/?url=${encodeURIComponent(malUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(malUrl)}`,
          `/api/mal/watchlist/${encodeURIComponent(username)}`
        ];

        let lastError = null;
        for (const ep of endpoints) {
          try {
            const res = await fetchWithTimeout(ep, { headers: { 'Accept': 'application/json' } }, 9000);
            if (!res.ok) continue;

            let data = await res.json();
            if (typeof data === 'string') {
              try { data = JSON.parse(data); } catch (e) {}
            }
            if (data && typeof data === 'object' && Array.isArray(data.contents)) {
              data = data.contents;
            }

            if (Array.isArray(data) && data.length) {
              return data.map((item) => {
                const title = item.anime_title || item.title || '';
                const malId = item.anime_id || item.malId || null;
                const cover = item.anime_image_path || item.coverUrl || '';
                const rawSt = item.anime_airing_status !== undefined
                  ? (item.anime_airing_status === 1 ? 'RELEASING' : item.anime_airing_status === 3 ? 'NOT_YET_RELEASED' : 'FINISHED')
                  : (item.status || '').toLowerCase().includes('airing') ? 'RELEASING' : 'FINISHED';

                const scoreVal = (item.anime_score_val !== undefined && item.anime_score_val !== null && item.anime_score_val !== 0)
                  ? String(item.anime_score_val)
                  : (item.malScore ? String(item.malScore) : (item.score && item.score > 0 ? String(item.score) : ''));

                return {
                  title,
                  malId: malId ? Number(malId) : null,
                  coverUrl: cleanMalCoverUrl(cover),
                  infoUrl: malId ? `https://myanimelist.net/anime/${malId}` : '',
                  animeStatus: rawSt,
                  anilistScore: '',
                  kitsuScore: '',
                  malScore: scoreVal
                };
              }).filter((item) => item.title);
            }
          } catch (err) {
            lastError = err;
          }
        }
        throw lastError || new Error('Could not load watchlist from MyAnimeList.');
      }

      async function fetchAnilistWatchingDetailed(username) {
        const query = `
          query ($userName: String) {
            MediaListCollection(userName: $userName, type: ANIME, status: CURRENT) {
              lists {
                entries {
                  media {
                    ${ANILIST_MEDIA_FIELDS}
                  }
                }
              }
            }
          }
        `;

        const res = await fetchWithTimeout('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query, variables: { userName: username } })
        }, 9000);

        if (!res.ok) throw new Error('AniList request failed.');
        const json = await res.json();
        const lists = json?.data?.MediaListCollection?.lists || [];
        const results = [];

        for (const list of lists) {
          for (const entry of (list.entries || [])) {
            if (entry.media) {
              const item = mapAnilistCandidate(entry.media);
              if (item.title) {
                results.push({
                  title: item.title,
                  malId: item.idMal,
                  coverUrl: item.coverUrl,
                  infoUrl: item.infoUrl,
                  animeStatus: item.animeStatus,
                  anilistScore: item.score,
                  kitsuScore: '',
                  malScore: ''
                });
              }
            }
          }
        }
        return results;
      }

      async function fetchKitsuWatchingDetailed(username) {
        const userRes = await fetchWithTimeout(`https://kitsu.io/api/edge/users?filter[name]=${encodeURIComponent(username)}`, {
          headers: { 'Accept': 'application/vnd.api+json' }
        }, 9000);

        if (!userRes.ok) throw new Error('Kitsu user request failed.');
        const userJson = await userRes.json();
        const userId = userJson?.data?.[0]?.id;
        if (!userId) throw new Error('Kitsu user not found.');

        const entriesUrl = `https://kitsu.io/api/edge/library-entries?filter[userId]=${userId}&filter[status]=current&filter[kind]=anime&include=anime&page[limit]=50`;
        const entriesRes = await fetchWithTimeout(entriesUrl, {
          headers: { 'Accept': 'application/vnd.api+json' }
        }, 9000);

        if (!entriesRes.ok) throw new Error('Kitsu library request failed.');
        const entriesJson = await entriesRes.json();
        const included = entriesJson?.included || [];
        const animeMap = {};

        for (const inc of included) {
          if (inc.type === 'anime') {
            const attrs = inc.attributes || {};
            const title = attrs.canonicalTitle || attrs.titles?.en || attrs.titles?.en_jp;
            const coverUrl = attrs.posterImage?.original || attrs.posterImage?.large || attrs.posterImage?.medium || '';
            const slug = attrs.slug;
            const infoUrl = slug ? `https://kitsu.io/anime/${slug}` : '';
            const rawStatus = attrs.status;
            const animeStatus = rawStatus === 'current' ? 'RELEASING' : (rawStatus === 'unreleased' || rawStatus === 'upcoming' || rawStatus === 'tba') ? 'NOT_YET_RELEASED' : 'FINISHED';
            let score = '';
            if (attrs.averageRating && !isNaN(attrs.averageRating)) {
              score = `${Math.round(Number(attrs.averageRating))}%`;
            }
            animeMap[inc.id] = { title, coverUrl, infoUrl, animeStatus, kitsuScore: score, anilistScore: '', malScore: '' };
          }
        }

        const results = [];
        for (const item of (entriesJson.data || [])) {
          const animeId = item.relationships?.anime?.data?.id;
          if (animeId && animeMap[animeId]) {
            results.push(animeMap[animeId]);
          }
        }
        return results;
      }

        const lines = raw

        for (const name of lines) {

          if (!isDuplicate) {

          }
        }

        titlesInput.value = '';

        saveEntries();
        renderEntries();
        updateControls();

        setStatus(t.addedFetching(entries.length));
        fetchAllCovers();
      }

      async function convertImgToBase64(imgUrl) {
        if (!imgUrl || imgUrl.startsWith('data:')) return imgUrl;

        const blobToDataURL = (blob) =>
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });

        const cleanUrl = imgUrl.replace(/^https?:\/\//, '');

        const sourcesToTry = [
          `https://i0.wp.com/${cleanUrl}`,
          `https://i1.wp.com/${cleanUrl}`,
          `https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&refresh=2592000&url=${encodeURIComponent(imgUrl)}`,
          `https://wsrv.nl/?url=${encodeURIComponent(imgUrl)}&output=jpg`,
          imgUrl
        ];

        for (const url of sourcesToTry) {
          try {
            const res = await fetchWithTimeout(url, { mode: 'cors' }, 5000);
            if (res.ok) {
              const blob = await res.blob();
              if (blob && blob.size > 200) {
                const dataUrl = await blobToDataURL(blob);
                if (dataUrl && dataUrl.startsWith('data:image')) {
                  return dataUrl;
                }
              }
            }
          } catch (e) {}
        }

        return imgUrl;
      }

      async function prepareImagesForCanvas() {
        const imgElements = Array.from(rankingExportArea.querySelectorAll('img'));
        const originalSources = imgElements.map((img) => img.src);

        await Promise.all(
          imgElements.map(async (img) => {
            if (img.src && !img.src.startsWith('data:')) {
              const base64 = await convertImgToBase64(img.src);
              if (base64 && base64.startsWith('data:image')) {
                img.src = base64;
              }
            }
          })
        );

        await Promise.all(
          imgElements.map(
            (img) =>
              new Promise((resolve) => {
                if (img.complete && img.naturalHeight !== 0) {
                  if (img.decode) img.decode().then(resolve).catch(resolve);
                  else resolve();
                } else {
                  img.onload = () => {
                    if (img.decode) img.decode().then(resolve).catch(resolve);
                    else resolve();
                  };
                  img.onerror = resolve;
                }
              })
          )
        );

        await sleep(250);
        return { imgElements, originalSources };
      }

      async function exportRankingToImage() {
        const t = translations[currentLang];
        if (typeof html2canvas === 'undefined') {
          alert(t.libError);

        const originalText = exportImageBtn.textContent;
        exportImageBtn.disabled = true;
        exportImageBtn.textContent = t.preparingCovers;

        let imgData = null;

        try {
          imgData = await prepareImagesForCanvas();
          exportImageBtn.textContent = t.generatingImage;

          const isDark = document.body.classList.contains('dark');
          const bgColor = isDark ? '#121214' : '#f7f7f7';

          const canvas = await html2canvas(rankingExportArea, {
            useCORS: true,

            backgroundColor: bgColor,

            logging: false
          });

          const link = document.createElement('a');
          link.download = `ranking-anime-${new Date().toISOString().slice(0, 10)}.png`;
          link.href = canvas.toDataURL('image/png');

      async function uploadRankingToLitterbox() {

        const originalText = uploadLitterboxBtn.textContent;

            backgroundColor: bgColor,
            scale: 2,

          });

            fallbackData.append('time', '72h');
            fallbackData.append('fileToUpload', blob, `ranking-anime-${new Date().toISOString().slice(0, 10)}.png`);

            response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://litterbox.catbox.moe/resources/internals/api.php'), {
              method: 'POST',
              body: fallbackData
            });
          }

          if (!response || !response.ok) {

          }

          const fileUrl = (await response.text()).trim();

        } finally {
          if (imgData) {
            imgData.imgElements.forEach((img, index) => {

      function uid() {

      }

      function createEntry(name, malId = null) {
        return {
          id: uid(),
          name: name.trim(),

          infoUrl: anilistSearchUrl(name.trim()),

          source: '',

      function formatScoreBadgesHtml(entry) {
        const badges = [];
        if (entry.malScore) {
          badges.push(`<span class="score-badge score-mal" title="MyAnimeList Score">MAL: ★ ${escapeHtml(entry.malScore)}</span>`);
        }
        if (entry.anilistScore) {

        }

        }
        if (!badges.length) return '';

      }
      
      function cleanMalCoverUrl(url) {
        if (!url) return '';
        return url.replace(/\/r\/\d+x\d+/, '').split('?')[0];
      }

      function normalizeTitle(value = '') {
        return String(value)
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim()
          .replace(/[^\p{L}\p{N}\s]/gu, ' ')
          .replace(/\s+/g, ' ');
      }

      function scoreCandidateMatch(query, candidateTitle) {
        const qWords = normalizeTitle(query).split(' ').filter(w => w.length > 2);
        const cTitleNorm = normalizeTitle(candidateTitle);
        if (!qWords.length) return 0;
        let matches = 0;
        for (const w of qWords) {
          if (cTitleNorm.includes(w)) matches++;
        }
        return matches / qWords.length;
      }

      /* Szybki generator zapytań wyszukiwania (wysoki sygnał, bez powtórzeń) */
      function getSearchQueries(rawTitle) {
        const queries = [];
        const add = (q) => {
          const trimmed = q?.trim();
          if (trimmed && trimmed.length >= 2 && !queries.includes(trimmed)) {
            queries.push(trimmed);
          }
        };

        add(rawTitle);

        const baseTitle = rawTitle.replace(/\s*\([^\)]*\)/g, '').trim();
        if (baseTitle !== rawTitle) add(baseTitle);

        const beforeColon = baseTitle.split(/[:\-—]/)[0]?.trim();
        if (beforeColon && beforeColon.length >= 3 && beforeColon !== baseTitle) {
          add(beforeColon);
        }

        const cleanPunct = baseTitle.replace(/[:\-—~|/()\[\].,!?]/g, ' ').replace(/\s+/g, ' ').trim();
        if (cleanPunct !== baseTitle) add(cleanPunct);

        return queries.slice(0, 3);
      }

      function setStatus(text = '') {
        statusEl.textContent = text;
      }

      function setError(text = '') {
        errorBox.hidden = !text;
        errorBox.classList.toggle('hidden', !text);
        errorBox.textContent = text;
      }

      function showSection(el) {
        el.hidden = false;
        el.classList.remove('hidden');

      function hideSection(el) {

        el.classList.add('hidden');
      }

      /* Super-szybkie równoległe pobieranie okładek i ocen (12 wątków, in-place DOM update) */
      async function fetchAllCovers() {
        const t = translations[currentLang];
        if (isFetching) return;

        if (!entries.length) {
          setStatus(t.pastePrompt);
          return;
        }

        const missing = entries.filter((entry) => entry.status !== 'ok' || !entry.coverUrl || !entry.malScore || !entry.anilistScore || !entry.kitsuScore);

        if (!missing.length) {
          setStatus(t.allCoversFetched);
          return;
        }

        isFetching = true;
        missing.forEach(e => { e.status = 'loading'; });
        renderEntries();
        updateControls();
        setError('');
        setStatus(t.fetchStarted);

        const CONCURRENCY = 12;
        let currentIndex = 0;
        let saveTimeout = null;

        const triggerThrottledSave = () => {
          if (!saveTimeout) {
            saveTimeout = setTimeout(() => {
              saveEntries();
              updateControls();
              saveTimeout = null;
            }, 300);
          }
        };

        async function worker() {
          while (currentIndex < missing.length) {
            const entry = missing[currentIndex++];
            try {
              const result = await getCoverForTitle(entry);

              entry.coverUrl = result.coverUrl || entry.coverUrl || '';
              entry.infoUrl = result.infoUrl || entry.infoUrl || anilistSearchUrl(entry.matchedTitle || entry.name);
              entry.matchedTitle = result.matchedTitle || entry.name;
              entry.source = result.source || entry.source || '';
              if (result.anilistScore) entry.anilistScore = result.anilistScore;
              if (result.kitsuScore) entry.kitsuScore = result.kitsuScore;
              if (result.malScore) entry.malScore = result.malScore;
              if (result.animeStatus) entry.animeStatus = result.animeStatus;
              entry.candidates = entry.candidates.length ? entry.candidates : (result.candidates || []);
              entry.malId = result.malId || entry.malId;
              entry.status = entry.coverUrl ? 'ok' : 'error';
            } catch (err) {
              console.warn(`Failed to fetch metadata: ${entry.name}`, err);
              entry.status = entry.coverUrl ? 'ok' : 'error';
            }

            updateSingleEntryElement(entry);
            triggerThrottledSave();
          }
        }

        const workers = Array.from({ length: Math.min(CONCURRENCY, missing.length) }, () => worker());
        await Promise.all(workers);

        if (saveTimeout) {
          clearTimeout(saveTimeout);
          saveTimeout = null;
        }
        saveEntries();
        isFetching = false;
        updateControls();
        setStatus(t.fetchFinished);
      }

      async function getCoverForTitle(entry) {
        const title = entry.matchedTitle || entry.name;
        let resolvedMalId = entry.malId ? parseInt(entry.malId, 10) : null;
        const cached = readCoverCache(title);

        if (cached && cached.coverUrl && cached.fetchedAll && cached.anilistScore && cached.kitsuScore && cached.malScore) {
          return cached;
        }

        let coverUrl = cached?.coverUrl || entry.coverUrl || '';
        let infoUrl = cached?.infoUrl || entry.infoUrl || '';
        let matchedTitle = cached?.matchedTitle || entry.matchedTitle || title;
        let source = cached?.source || entry.source || '';
        let anilistScore = cached?.anilistScore || entry.anilistScore || '';
        let kitsuScore = cached?.kitsuScore || entry.kitsuScore || '';
        let malScore = cached?.malScore || entry.malScore || '';
        let animeStatus = cached?.animeStatus || entry.animeStatus || '';
        let candidates = cached?.candidates || entry.candidates || [];
        if (!resolvedMalId && cached?.malId) {
          resolvedMalId = parseInt(cached.malId, 10);
        }

        const altTitles = [title, matchedTitle].filter((t, idx, self) => t && self.indexOf(t) === idx);

        // 1. Parallel fetch for all missing services
        const anilistPromise = (!anilistScore || !coverUrl || !candidates.length)
          ? fetchAnilistData(title, resolvedMalId).catch(() => null)
          : Promise.resolve(null);

        const kitsuPromise = !kitsuScore
          ? fetchFirstMatch(altTitles, fetchKitsuData).catch(() => null)
          : Promise.resolve(null);

        const malPromise = !malScore
          ? (resolvedMalId
              ? fetchMalData(title, resolvedMalId)
              : fetchFirstMatch(altTitles, (t) => fetchMalData(t))).catch(() => null)
          : Promise.resolve(null);

        const [aniRes, kitsuRes, malRes] = await Promise.allSettled([anilistPromise, kitsuPromise, malPromise]);

        if (aniRes.status === 'fulfilled' && aniRes.value?.candidates?.length) {
          candidates = aniRes.value.candidates;
          const top = candidates[0];
          if (!coverUrl) coverUrl = top.coverUrl;
          if (!infoUrl) infoUrl = top.infoUrl;
          if (!matchedTitle || matchedTitle === title) matchedTitle = top.title;
          if (!animeStatus) animeStatus = top.animeStatus;
          if (!source) source = 'AniList';
          if (top.score && !anilistScore) anilistScore = top.score;
          if (top.idMal && !resolvedMalId) resolvedMalId = parseInt(top.idMal, 10);
        }

        if (kitsuRes.status === 'fulfilled' && kitsuRes.value) {
          const kData = kitsuRes.value;
          if (!coverUrl && kData.coverUrl) {
            coverUrl = kData.coverUrl;
            if (!source) source = 'Kitsu';
          }
          if (!infoUrl && kData.infoUrl) infoUrl = kData.infoUrl;
          if (!animeStatus && kData.animeStatus) animeStatus = kData.animeStatus;
          if (kData.score && !kitsuScore) kitsuScore = kData.score;
          if (!candidates.length && kData.candidates) candidates = kData.candidates;
        }

        if (malRes.status === 'fulfilled' && malRes.value) {
          const mData = malRes.value;
          if (mData.malScore && !malScore) malScore = mData.malScore;
          if (!coverUrl && mData.coverUrl) {
            coverUrl = mData.coverUrl;
            if (!source) source = 'MyAnimeList';
          }
          if (mData.malId && !resolvedMalId) resolvedMalId = parseInt(mData.malId, 10);
        }

        // If MAL score was missing and AniList just discovered idMal, quick lookup by ID
        if (!malScore && resolvedMalId) {
          try {
            const extraMal = await fetchMalData(matchedTitle || title, resolvedMalId);
            if (extraMal?.malScore) malScore = extraMal.malScore;
          } catch (e) {}
        }

        if (!coverUrl && !matchedTitle) {
          throw new Error('No anime cover found.');
        }

        const result = {
          coverUrl,
          infoUrl: infoUrl || anilistSearchUrl(title),
          matchedTitle: matchedTitle || title,
          source: source || 'AniList',
          anilistScore,
          kitsuScore,
          malScore,
          animeStatus: animeStatus || 'FINISHED',
          candidates,
          malId: resolvedMalId,
          fetchedAll: true
        };

        if (coverUrl) {
          writeCoverCache(title, result);
        }
        return result;
      }

      async function fetchAnilistData(title, malId) {
        if (malId) {
          try {
            const byId = await fetchAnilistByMalId(malId);
            if (byId?.candidates?.length) return byId;
          } catch (e) {
            console.warn(`AniList by malId (${malId}) failed, trying title search:`, e);
          }
        }
        return await fetchAnilistCandidates(title);
      }

      async function fetchAnilistByMalId(malId) {
        const idInt = parseInt(malId, 10);
        if (isNaN(idInt) || idInt <= 0) throw new Error('Invalid malId');

        const query = `query ($idMal: Int) { Media(idMal: $idMal, type: ANIME) { ${ANILIST_MEDIA_FIELDS} } }`;
        const res = await fetchWithTimeout('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query, variables: { idMal: idInt } })
        }, 7000);

        if (!res.ok) throw new Error(`AniList MAL ID failed (${res.status})`);
        const json = await res.json();
        const media = json?.data?.Media;
        if (!media) throw new Error('Media not found');

        return { candidates: [mapAnilistCandidate(media)] };
      }

      async function fetchAnilistCandidates(originalQuery) {
        const queries = getSearchQueries(originalQuery);
        let lastError = null;

        for (const q of queries) {
          try {
            const query = `query ($search: String) { Page(page: 1, perPage: 10) { media(search: $search, type: ANIME, sort: [SEARCH_MATCH, POPULARITY_DESC]) { ${ANILIST_MEDIA_FIELDS} } } }`;
            const res = await fetchWithTimeout('https://graphql.anilist.co', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({ query, variables: { search: q } })
            }, 6000);

            if (!res.ok) continue;
            const json = await res.json();
            const mediaList = json?.data?.Page?.media || [];
            if (!mediaList.length) continue;

            const mapped = mediaList.map(m => mapAnilistCandidate(m, originalQuery));
            return { candidates: sortCandidates(mapped, originalQuery) };
          } catch (err) {
            lastError = err;
          }
        }

        throw lastError || new Error('No results on AniList.');
      }

      async function fetchKitsuData(originalQuery) {
        const queries = getSearchQueries(originalQuery);
        let lastError = null;

        for (const q of queries) {
          try {
            const url = `https://kitsu.io/api/edge/anime?${new URLSearchParams({ 'filter[text]': q, 'page[limit]': '10' })}`;
            const res = await fetchWithTimeout(url, { headers: { 'Accept': 'application/vnd.api+json' } }, 6000);
            if (!res.ok) continue;

            const json = await res.json();
            const list = Array.isArray(json.data) ? json.data : [];
            if (!list.length) continue;

            const candidates = list.map((item) => {
              const attrs = item.attributes || {};
              const rawStatus = (attrs.status || '').toLowerCase();
              const animeStatus = rawStatus === 'current' ? 'RELEASING' : (['unreleased', 'upcoming', 'tba'].includes(rawStatus) ? 'NOT_YET_RELEASED' : 'FINISHED');
              const coverUrl = attrs.posterImage?.original || attrs.posterImage?.large || attrs.posterImage?.medium || attrs.posterImage?.small || '';
              const matchedTitle = attrs.canonicalTitle || attrs.titles?.en || attrs.titles?.en_jp || originalQuery;
              const infoUrl = attrs.slug ? `https://kitsu.io/anime/${attrs.slug}` : `https://kitsu.io/anime?text=${encodeURIComponent(originalQuery)}`;
              const score = (attrs.averageRating && !isNaN(attrs.averageRating)) ? `${Math.round(Number(attrs.averageRating))}%` : '';

              return {
                id: item.id,
                coverUrl,
                infoUrl,
                title: matchedTitle,
                animeStatus,
                status: rawStatus,
                year: (attrs.startDate || '').slice(0, 4),
                format: (attrs.subtype || 'TV').toUpperCase(),
                score
              };
            });

            sortCandidates(candidates, originalQuery);
            const best = candidates[0];
            return {
              coverUrl: best.coverUrl,
              infoUrl: best.infoUrl,
              matchedTitle: best.title,
              animeStatus: best.animeStatus,
              score: best.score,
              candidates
            };
          } catch (err) {
            lastError = err;
          }
        }

        throw lastError || new Error('No results on Kitsu.');
      }

      async function fetchMalData(originalQuery, malId = null) {
        // 1. If malId is known, query Tenrai directly by ID (instant, precise)
        if (malId) {
          try {
            const res = await fetchWithTimeout(`https://api.tenrai.org/v1/anime/${malId}`, {}, 4000);
            if (res.ok) {
              const json = await res.json();
              const item = json?.data;
              if (item) {
                return {
                  malId: item.mal_id || malId,
                  title: item.title || '',
                  malScore: item.score ? String(item.score) : '',
                  coverUrl: item.images?.jpg?.large_image_url || item.images?.jpg?.image_url || '',
                  animeStatus: item.status || ''
                };
              }
            }
          } catch (e) {}
        }

        // 2. Query Tenrai REST API by search queries
        const queries = getSearchQueries(originalQuery);
        for (const q of queries) {
          try {
            const res = await fetchWithTimeout(`https://api.tenrai.org/v1/anime?q=${encodeURIComponent(q)}&limit=1`, {}, 4000);
            if (res.ok) {
              const json = await res.json();
              const item = json?.data?.[0];
              if (item) {
                return {
                  malId: item.mal_id || null,
                  title: item.title || '',
                  malScore: item.score ? String(item.score) : '',
                  coverUrl: item.images?.jpg?.large_image_url || item.images?.jpg?.image_url || '',
                  animeStatus: item.status || ''
                };
              }
            }
          } catch (e) {}
        }

        return null;
      }

      async function fetchWithTimeout(url, options = {}, timeout = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);

        try {
          return await fetch(url, {
            ...options,
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeoutId);
        }
      }

      /* Modal Disambiguation Handlers */
      async function openDisambiguationModal(entry) {
        activeDisambiguationEntry = entry;
        modalSearchInput.value = entry.matchedTitle || entry.name;
        disambiguationModal.classList.remove('hidden');
        renderCandidates(entry.candidates || []);

        if (!entry.candidates || !entry.candidates.length) {
          await searchModalQuery();
        }
      }

      function closeDisambiguationModal() {
        activeDisambiguationEntry = null;
        disambiguationModal.classList.add('hidden');
      }

      async function searchModalQuery() {
        const q = modalSearchInput.value.trim();
        if (!q) return;

        modalLoading.style.display = 'block';
        modalLoading.textContent = translations[currentLang].modalLoading;
        candidateGrid.innerHTML = '';

        try {
          const res = await fetchAnilistCandidates(q);
          renderCandidates(res.candidates || []);
        } catch (e) {
          try {
            const kitsuRes = await fetchKitsuData(q);
            renderCandidates(kitsuRes.candidates || []);
          } catch (err) {
            candidateGrid.innerHTML = `<div class="muted">No results found.</div>`;
          }
        } finally {
          modalLoading.style.display = 'none';
        }
      }

      function renderCandidates(list) {
        candidateGrid.innerHTML = '';

        if (!list || !list.length) {
          candidateGrid.innerHTML = `<div class="muted">No candidates available. Try searching above.</div>`;
          return;
        }

        list.forEach((candidate) => {
          const card = document.createElement('div');
          card.className = 'candidate-card';

          const badgeHtml = getAnimeStatusBadge(candidate.animeStatus || candidate.status);
          const metaYearFormat = [candidate.year, candidate.format].filter(Boolean).join(' • ');

          card.innerHTML = `
            <img src="${escapeHtml(candidate.coverUrl || getPlaceholderCover())}" alt="" />
            <div style="flex: 1; font-size: 13px;">
              <strong style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(candidate.title)}</strong>
              <div class="muted" style="margin-top: 2px;">${escapeHtml(metaYearFormat)}</div>
              ${candidate.score ? `<div class="muted">★ ${escapeHtml(candidate.score)}</div>` : ''}
              <div style="margin-top: 4px;">${badgeHtml}</div>
            </div>
          `;

          card.addEventListener('click', async () => {
            if (!activeDisambiguationEntry) return;

            activeDisambiguationEntry.coverUrl = candidate.coverUrl;
            activeDisambiguationEntry.matchedTitle = candidate.title;
            activeDisambiguationEntry.anilistScore = candidate.score || '';
            activeDisambiguationEntry.infoUrl = candidate.infoUrl;
            activeDisambiguationEntry.animeStatus = candidate.animeStatus || candidate.status || 'FINISHED';
            activeDisambiguationEntry.source = 'AniList';
            if (candidate.idMal) activeDisambiguationEntry.malId = parseInt(candidate.idMal, 10);
            activeDisambiguationEntry.status = 'ok';

            const modalAltTitles = [candidate.title, candidate.englishTitle].filter(Boolean);

            try {
              const [kitsuRes, malRes] = await Promise.allSettled([
                fetchFirstMatch(modalAltTitles, fetchKitsuData),
                candidate.idMal
                  ? fetchMalData(candidate.title, candidate.idMal)
                  : fetchFirstMatch(modalAltTitles, (t) => fetchMalData(t))
              ]);
              if (kitsuRes.status === 'fulfilled' && kitsuRes.value?.score) {
                activeDisambiguationEntry.kitsuScore = kitsuRes.value.score;
              }
              if (malRes.status === 'fulfilled' && malRes.value?.malScore) {
                activeDisambiguationEntry.malScore = malRes.value.malScore;
              }
            } catch (e) {}

            saveEntries();
            renderEntries();
            closeDisambiguationModal();
          });

          candidateGrid.appendChild(card);
        });
      }

      function coverCacheKey(title) {
        return COVER_CACHE_PREFIX + normalizeTitle(title);
      }

      function readCoverCache(title) {
        try {
          const raw = localStorage.getItem(coverCacheKey(title));
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (err) {
          return null;
        }
      }

      function writeCoverCache(title, data) {
        try {
          localStorage.setItem(coverCacheKey(title), JSON.stringify(data));
        } catch (err) {}
      }

      function clearCoverCache() {
        const t = translations[currentLang];
        if (!entries.length) {
          setStatus(t.emptyCacheMsg);
          return;
        }

        const keysToRemove = [];
        try {
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (key && key.startsWith(COVER_CACHE_PREFIX)) {
              keysToRemove.push(key);
            }
          }
          for (const key of keysToRemove) {
            localStorage.removeItem(key);
          }
        } catch (err) {}

        entries = entries.map((entry) => ({
          ...entry,
          coverUrl: '',
          status: 'pending',
          matchedTitle: '',
          source: '',
          anilistScore: '',
          kitsuScore: '',
          malScore: '',
          animeStatus: '',
          candidates: [],
          infoUrl: anilistSearchUrl(entry.name)
        }));

        saveEntries();
        renderEntries();
        updateControls();
        setStatus(t.cacheCleared(keysToRemove.length));
      }

      function saveEntries() {
        try {
          const serialized = entries.map((entry) => ({
            ...entry,
            status: entry.status === 'loading' ? 'pending' : entry.status
          }));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serialized));
        } catch (err) {}
      }

      function loadEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return;

          entries = parsed
            .filter((item) => item && typeof item.name === 'string' && item.name.trim())
            .map((item) => ({
              id: String(item.id || uid()),
              name: item.name.trim(),
              malId: item.malId ? Number(item.malId) : null,
              coverUrl: typeof item.coverUrl === 'string' ? item.coverUrl : '',
              infoUrl: typeof item.infoUrl === 'string' && item.infoUrl ? item.infoUrl : anilistSearchUrl(item.name.trim()),
              status: item.status === 'ok' ? 'ok' : item.status === 'error' ? 'error' : 'pending',
              matchedTitle: typeof item.matchedTitle === 'string' ? item.matchedTitle : '',
              source: typeof item.source === 'string' ? item.source : '',
              anilistScore: typeof item.anilistScore === 'string' ? item.anilistScore : '',
              kitsuScore: typeof item.kitsuScore === 'string' ? item.kitsuScore : '',
              malScore: typeof item.malScore === 'string' ? item.malScore : '',
              animeStatus: typeof item.animeStatus === 'string' ? item.animeStatus : '',
              candidates: Array.isArray(item.candidates) ? item.candidates : []
            }));
        } catch (err) {
          entries = [];
        }
      }

      function renderEntries() {
        const t = translations[currentLang];
        entryList.innerHTML = '';

        for (const entry of entries) {
          entryList.appendChild(createEntryRowElement(entry, t));
        }
      }

      function createEntryRowElement(entry, t) {
        const row = document.createElement('div');
        row.className = 'entry-item';
        row.dataset.entryId = entry.id;

        const displayTitle = entry.matchedTitle || entry.name;
        const statusBadge = getAnimeStatusBadge(entry.animeStatus);

        row.innerHTML = `
          <img class="entry-thumb" src="${escapeHtml(entry.coverUrl || getPlaceholderCover())}" alt="" />

          <div style="flex: 1; min-width: 0;">
            <div class="entry-title" style="word-break: break-word;">${escapeHtml(displayTitle)}</div>
            <div class="entry-meta-muted muted" style="margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
              ${statusBadge}
              <span>${escapeHtml(statusLabel(entry.status))}${entry.source ? ' • ' + escapeHtml(entry.source) : ''}</span>
            </div>
            <div class="entry-scores-wrap">${formatScoreBadgesHtml(entry)}</div>
          </div>

          <div class="entry-actions">
            <button class="secondary" data-disambig-id="${entry.id}" style="font-size: 13px; padding: 6px 10px;">${escapeHtml(t.changeVersionBtn)}</button>
            <a
              class="entry-info-link"
              href="${escapeHtml(entry.infoUrl || anilistSearchUrl(displayTitle))}"
              target="_blank"
              rel="noopener"
              style="font-size: 14px;"
            >${escapeHtml(t.infoLink)}</a>
            <button class="danger" data-remove-id="${entry.id}" style="font-size: 13px; padding: 6px 10px;">${escapeHtml(t.removeBtn)}</button>
          </div>
        `;

        const img = row.querySelector('img');
        img.addEventListener('error', () => {
          img.src = getPlaceholderCover();
        });

        return row;
      }

      function updateSingleEntryElement(entry) {
        const row = entryList.querySelector(`[data-entry-id="${entry.id}"]`);
        if (!row) return;
        const t = translations[currentLang];
        const displayTitle = entry.matchedTitle || entry.name;
        const statusBadge = getAnimeStatusBadge(entry.animeStatus);

        const img = row.querySelector('.entry-thumb');
        if (img && entry.coverUrl && img.src !== entry.coverUrl) {
          img.src = entry.coverUrl;
        }

        const titleEl = row.querySelector('.entry-title');
        if (titleEl) titleEl.textContent = displayTitle;

        const mutedEl = row.querySelector('.entry-meta-muted');
        if (mutedEl) {
          mutedEl.innerHTML = `
            ${statusBadge}
            <span>${escapeHtml(statusLabel(entry.status))}${entry.source ? ' • ' + escapeHtml(entry.source) : ''}</span>
          `;
        }

        const scoresWrap = row.querySelector('.entry-scores-wrap');
        if (scoresWrap) {
          scoresWrap.innerHTML = formatScoreBadgesHtml(entry);
        }

        const infoLink = row.querySelector('.entry-info-link');
        if (infoLink && entry.infoUrl) {
          infoLink.href = entry.infoUrl;
        }
      }

      function statusLabel(status) {
        const t = translations[currentLang];
        const labels = {
          pending: t.itemPending,
          loading: t.itemLoading,
          ok: t.itemOk,
          error: t.itemError
        };
        return labels[status] || status;
      }

      function updateControls() {
        const t = translations[currentLang];
        addBtn.disabled = false;
        fetchCoversBtn.disabled = isFetching || entries.length === 0;
        clearCoverCacheBtn.disabled = isFetching || entries.length === 0;
        clearListBtn.disabled = isFetching || entries.length === 0;
        startBtn.disabled = isFetching || entries.length < 2;

        const missingCovers = entries.filter((entry) => entry.status !== 'ok').length;

        if (!entries.length) {
          entriesMeta.textContent = t.emptyList;
          return;
        }

        entriesMeta.textContent =
          `${t.titleCount}${entries.length}` +
          (missingCovers ? `${t.missingCovers}${missingCovers}` : '');
      }

      function clearList() {
        const t = translations[currentLang];
        if (!entries.length) return;
        if (!confirm(t.clearConfirm)) return;

        entries = [];
        saveEntries();
        renderEntries();
        updateControls();
        setStatus(t.listCleared);
      }

      async function startRanking() {
        if (entries.length < 2) return;

        compareCancelled = false;
        compareCount = 0;
        setError('');
        setStatus('');

        hideSection(setup);
        hideSection(resultView);
        showSection(compareView);

        try {
          const initialClusters = entries.map((entry) => [entry]);
          const rankedClusters = await mergeSort(initialClusters);

          lastRankedClusters = rankedClusters;
          renderRanking(rankedClusters);

          hideSection(compareView);
          showSection(resultView);
        } catch (err) {
          if (err && err.name === 'CancelledError') {
            showSetup();
            return;
          }
          hideSection(compareView);
          showSection(setup);
          setError('Error during comparison: ' + (err?.message || err));
        }
      }

      function cancelCompare() {
        compareCancelled = true;
        if (resolveChoice) {
          const resolver = resolveChoice;
          resolveChoice = null;
          resolver(null);
        }
        showSetup();
      }

      function showSetup() {
        showSection(setup);
        hideSection(compareView);
        hideSection(resultView);
        setStatus('');
        setError('');
        updateControls();
      }

      async function mergeSort(clusters) {
        if (clusters.length <= 1) return clusters;
        const middle = Math.floor(clusters.length / 2);
        const left = await mergeSort(clusters.slice(0, middle));
        const right = await mergeSort(clusters.slice(middle));
        return merge(left, right);
      }

      async function merge(left, right) {
        const result = [];
        let i = 0;
        let j = 0;

        while (i < left.length && j < right.length) {
          if (compareCancelled) throw new CancelledError();

          const choice = await askCompare(left[i][0], right[j][0]);
          if (!choice) throw new CancelledError();

          if (choice === 'tie') {
            result.push([...left[i], ...right[j]]);
            i += 1;
            j += 1;
          } else if (choice.id === left[i][0].id) {
            result.push(left[i]);
            i += 1;
          } else {
            result.push(right[j]);
            j += 1;
          }
        }

        return result.concat(left.slice(i)).concat(right.slice(j));
      }

      function askCompare(a, b) {
        const t = translations[currentLang];
        currentA = a;
        currentB = b;
        compareCount += 1;

        compareCounter.textContent = t.progressText(compareCount, entries.length);

        renderCompareCard(cardA, a);
        renderCompareCard(cardB, b);

        return new Promise((resolve) => {
          resolveChoice = resolve;
        });
      }

      function renderCompareCard(card, entry) {
        const t = translations[currentLang];
        card.dataset.id = entry.id;

        const displayTitle = entry.matchedTitle || entry.name;

        card.innerHTML = `
          <img src="${escapeHtml(entry.coverUrl || getPlaceholderCover())}" alt="" />
          <h3 style="margin-top: 10px; margin-bottom: 6px; line-height: 1.3;">${escapeHtml(displayTitle)}</h3>
          ${formatScoreBadgesHtml(entry)}
          <p class="muted" style="margin-top: 6px;">
            <a
              href="${escapeHtml(entry.infoUrl || anilistSearchUrl(displayTitle))}"
              target="_blank"
              rel="noopener"
            >${escapeHtml(t.infoLink)}</a>
          </p>
        `;

        const img = card.querySelector('img');
        img.addEventListener('error', () => {
          img.src = getPlaceholderCover();
        });
      }

      function renderRanking(clusters) {
        const t = translations[currentLang];
        rankList.innerHTML = '';
        let currentRank = 1;

        clusters.forEach((cluster) => {
          const rankForThisCluster = currentRank;

          cluster.forEach((entry) => {
            const row = document.createElement('div');
            row.className = 'ranking-item';

            const displayTitle = entry.matchedTitle || entry.name;

            row.innerHTML = `
              <div class="rank-number">${rankForThisCluster}.</div>
              <img src="${escapeHtml(entry.coverUrl || getPlaceholderCover())}" alt="" />
              <div style="flex: 1; min-width: 0;">
                <strong style="font-size: 16px; word-break: break-word;">${escapeHtml(displayTitle)}</strong>
                <div class="muted" style="margin-top: 3px; font-size: 13px;">
                  <a
                    href="${escapeHtml(entry.infoUrl || anilistSearchUrl(displayTitle))}"
                    target="_blank"
                    rel="noopener"
                  >${escapeHtml(t.infoLink)}</a>
                </div>
                ${formatScoreBadgesHtml(entry)}
              </div>
            `;

            const img = row.querySelector('img');
            img.addEventListener('error', () => {
              img.src = getPlaceholderCover();
            });

            rankList.appendChild(row);
          });

          currentRank += cluster.length;
        });
      }

      function anilistSearchUrl(title) {
        return `https://anilist.co/search/anime?search=${encodeURIComponent(title)}`;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function escapeHtml(value = '') {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }
    })();
  </script>
</body>
</html>
