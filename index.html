<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking anime</title>

  <!-- Biblioteka do generowania pliku graficznego -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #f7f7f7;
      --text: #111111;
      --surface: #ffffff;
      --border: #e2e2e2;
      --border-input: #bbbbbb;
      --muted: #666666;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --btn-secondary: #555555;
      --link: #0066cc;
      --card-shadow: rgba(0, 0, 0, 0.08);
      --thumb-bg: #dddddd;
      --progress-bg: #e2e2e2;
      --progress-bar: #2563eb;
    }

    body.dark {
      --bg: #121214;
      --text: #e4e4e7;
      --surface: #1e1e24;
      --border: #2e2e38;
      --border-input: #444450;
      --muted: #a1a1aa;
      --btn-bg: #e4e4e7;
      --btn-text: #121214;
      --btn-secondary: #3f3f46;
      --link: #60a5fa;
      --card-shadow: rgba(0, 0, 0, 0.4);
      --thumb-bg: #2d2d38;
      --progress-bg: #2e2e38;
      --progress-bar: #3b82f6;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }

    .header-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-input);
      resize: vertical;
      background: var(--surface);
      color: var(--text);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 15px;
      transition: opacity 0.15s;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--btn-secondary);
      color: #fff;
    }

    button.danger {
      background: #b91c1c;
      color: #fff;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      margin: 10px 0;
      font-weight: 700;
      min-height: 22px;
    }

    .error {
      color: #ef4444;
      font-weight: 700;
      margin: 10px 0;
      white-space: pre-wrap;
    }

    .hidden,
    [hidden] {
      display: none !important;
    }

    .entry-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .entry-thumb {
      width: 56px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--thumb-bg);
      flex: 0 0 auto;
    }

    .entry-title {
      font-weight: 700;
    }

    .entry-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .progress-container {
      width: 100%;
      background: var(--progress-bg);
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
      margin: 14px 0 8px 0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--progress-bar);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .tie-container {
      display: flex;
      justify-content: center;
      margin: 16px 0 10px 0;
    }

    .cards {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: stretch;
      margin-top: 10px;
    }

    .card {
      width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--card-shadow);
    }

    .card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--thumb-bg);
    }

    .vs {
      align-self: center;
      font-size: 30px;
      font-weight: 900;
    }

    #rankingExportArea {
      padding: 8px 0;
    }

    .ranking-item {
      display: flex;
      gap: 14px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .ranking-item img {
      width: 56px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--thumb-bg);
    }

    .rank-number {
      width: 38px;
      font-weight: 900;
      font-size: 18px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="header-container">
    <button id="themeToggleBtn" class="secondary" type="button">🌙 Ciemny motyw</button>
  </div>

  <section id="setup">
    <h1>Ranking anime</h1>

    <p>
      Wklej listę tytułów, okładki pobiorą się automatycznie.
    </p>

    <label for="titlesInput">
      Tytuły anime — jeden tytuł na linię:
    </label>

    <textarea
      id="titlesInput"
      rows="8"
      placeholder="Frieren: Beyond Journey's End
Steins;Gate
Attack on Titan
Bocchi the Rock!"
    ></textarea>

    <div class="controls">
      <button id="addBtn">Dodaj tytuły</button>
      <button id="fetchCoversBtn" class="secondary">Pobierz okładki</button>
      <button id="clearCoverCacheBtn" class="secondary">Wyczyść cache okładek</button>
      <button id="clearListBtn" class="danger">Wyczyść listę</button>
      <button id="startBtn" disabled>Rozpocznij porównywanie</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="errorBox" class="error hidden"></div>
    <div id="entriesMeta" class="muted"></div>

    <div id="entryList"></div>
  </section>

  <section id="compareView" class="hidden">
    <h2>Które anime jest lepsze?</h2>
    
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="compareCounter" class="muted"></div>

    <div class="controls">
      <button id="cancelCompareBtn" class="danger">Przerwij i wróć do listy</button>
    </div>

    <div class="tie-container">
      <button id="tieBtn" class="secondary" style="font-size: 16px; font-weight: bold; padding: 12px 24px;">
        🤝 Remis (oba tak samo dobre)
      </button>
    </div>

    <div class="cards" id="compareCards">
      <div class="card" id="cardA"></div>
      <div class="vs">VS</div>
      <div class="card" id="cardB"></div>
    </div>
  </section>

  <section id="resultView" class="hidden">
    <div class="controls">
      <button id="exportImageBtn" class="secondary">📸 Pobierz ranking jako obraz (PNG)</button>
      <button id="compareAgainBtn">Porównaj jeszcze raz</button>
      <button id="backFromResultBtn" class="secondary">Wróć do listy</button>
    </div>

    <div id="rankingExportArea">
      <h2>Twój ranking</h2>
      <div id="rankList"></div>
    </div>
  </section>

  <script>
    (() => {
      const titlesInput = document.getElementById('titlesInput');
      const addBtn = document.getElementById('addBtn');
      const fetchCoversBtn = document.getElementById('fetchCoversBtn');
      const clearCoverCacheBtn = document.getElementById('clearCoverCacheBtn');
      const clearListBtn = document.getElementById('clearListBtn');
      const startBtn = document.getElementById('startBtn');
      const themeToggleBtn = document.getElementById('themeToggleBtn');

      const statusEl = document.getElementById('status');
      const errorBox = document.getElementById('errorBox');
      const entriesMeta = document.getElementById('entriesMeta');
      const entryList = document.getElementById('entryList');

      const setup = document.getElementById('setup');
      const compareView = document.getElementById('compareView');
      const compareCards = document.getElementById('compareCards');
      const cardA = document.getElementById('cardA');
      const cardB = document.getElementById('cardB');
      const compareCounter = document.getElementById('compareCounter');
      const progressBar = document.getElementById('progressBar');
      const cancelCompareBtn = document.getElementById('cancelCompareBtn');
      const tieBtn = document.getElementById('tieBtn');

      const resultView = document.getElementById('resultView');
      const rankingExportArea = document.getElementById('rankingExportArea');
      const rankList = document.getElementById('rankList');
      const exportImageBtn = document.getElementById('exportImageBtn');
      const compareAgainBtn = document.getElementById('compareAgainBtn');
      const backFromResultBtn = document.getElementById('backFromResultBtn');

      const STORAGE_KEY = 'manual-anime-sorter:entries:v4';
      const COVER_CACHE_PREFIX = 'manual-anime-cover:v4:';
      const THEME_KEY = 'manual-anime-sorter:theme:v1';

      const PLACEHOLDER_COVER =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="100%" height="100%" fill="#888888"></rect><text x="50%" y="50%" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">Brak okładki</text></svg>`
        );

      let entries = [];
      let isFetching = false;

      let currentA = null;
      let currentB = null;
      let resolveChoice = null;
      let compareCount = 0;
      let compareCancelled = false;

      class CancelledError extends Error {
        constructor() {
          super('Porównywanie zostało przerwane.');
          this.name = 'CancelledError';
        }
      }

      initTheme();
      loadEntries();
      renderEntries();
      updateControls();

      themeToggleBtn.addEventListener('click', toggleTheme);
      addBtn.addEventListener('click', addTitles);
      fetchCoversBtn.addEventListener('click', fetchAllCovers);
      clearCoverCacheBtn.addEventListener('click', clearCoverCache);
      clearListBtn.addEventListener('click', clearList);
      startBtn.addEventListener('click', startRanking);
      cancelCompareBtn.addEventListener('click', cancelCompare);
      tieBtn.addEventListener('click', chooseTie);
      exportImageBtn.addEventListener('click', exportRankingToImage);
      compareAgainBtn.addEventListener('click', startRanking);
      backFromResultBtn.addEventListener('click', showSetup);

      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = saved || (prefersDark ? 'dark' : 'light');
        applyTheme(initialTheme);
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.body.classList.add('dark');
          themeToggleBtn.textContent = '☀️ Jasny motyw';
        } else {
          document.body.classList.remove('dark');
          themeToggleBtn.textContent = '🌙 Ciemny motyw';
        }
      }

      function toggleTheme() {
        const isDark = document.body.classList.contains('dark');
        const newTheme = isDark ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, newTheme);
        applyTheme(newTheme);
      }

      async function convertImgToBase64(imgUrl) {
        if (!imgUrl || imgUrl.startsWith('data:')) return imgUrl;

        const blobToDataURL = (blob) =>
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });

        const cleanUrl = imgUrl.replace(/^https?:\/\//, '');

        // WordPress Photon i Google Proxy są w 100% zgodne z Brave Shields i mają pełne nagłówki CORS
        const sourcesToTry = [
          `https://i0.wp.com/${cleanUrl}`,
          `https://i1.wp.com/${cleanUrl}`,
          `https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&refresh=2592000&url=${encodeURIComponent(imgUrl)}`,
          `https://wsrv.nl/?url=${encodeURIComponent(imgUrl)}&output=jpg`,
          imgUrl
        ];

        for (const url of sourcesToTry) {
          try {
            const res = await fetchWithTimeout(url, { mode: 'cors' }, 5000);
            if (res.ok) {
              const blob = await res.blob();
              if (blob && blob.size > 200) {
                const dataUrl = await blobToDataURL(blob);
                if (dataUrl && dataUrl.startsWith('data:image')) {
                  return dataUrl;
                }
              }
            }
          } catch (e) {}
        }

        return imgUrl;
      }

      async function exportRankingToImage() {
        if (typeof html2canvas === 'undefined') {
          alert('Błąd: Biblioteka do generowania obrazów nie została załadowana. Sprawdź połączenie z internetem.');
          return;
        }

        const originalText = exportImageBtn.textContent;
        exportImageBtn.disabled = true;
        exportImageBtn.textContent = '⏳ Przygotowywanie okładek...';

        const imgElements = Array.from(rankingExportArea.querySelectorAll('img'));
        const originalSources = imgElements.map((img) => img.src);

        try {
          // Konwersja okładek na format Base64 Data URL
          await Promise.all(
            imgElements.map(async (img) => {
              if (img.src && !img.src.startsWith('data:')) {
                const base64 = await convertImgToBase64(img.src);
                if (base64 && base64.startsWith('data:image')) {
                  img.src = base64;
                }
              }
            })
          );

          // Oczekiwanie na zdekodowanie obrazów
          await Promise.all(
            imgElements.map(
              (img) =>
                new Promise((resolve) => {
                  if (img.complete && img.naturalHeight !== 0) {
                    if (img.decode) {
                      img.decode().then(resolve).catch(resolve);
                    } else {
                      resolve();
                    }
                  } else {
                    img.onload = () => {
                      if (img.decode) img.decode().then(resolve).catch(resolve);
                      else resolve();
                    };
                    img.onerror = resolve;
                  }
                })
            )
          );

          await sleep(250);

          exportImageBtn.textContent = '⏳ Generowanie pliku graficznego...';

          const isDark = document.body.classList.contains('dark');
          const bgColor = isDark ? '#121214' : '#f7f7f7';

          const canvas = await html2canvas(rankingExportArea, {
            useCORS: true,
            allowTaint: false,
            backgroundColor: bgColor,
            scale: 2,
            logging: false
          });

          const link = document.createElement('a');
          link.download = `ranking-anime-${new Date().toISOString().slice(0, 10)}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          console.error('Błąd eksportu grafiki:', err);
          alert('Nie udało się wyeksportować obrazu: ' + (err?.message || err));
        } finally {
          imgElements.forEach((img, index) => {
            img.src = originalSources[index];
          });
          exportImageBtn.disabled = false;
          exportImageBtn.textContent = originalText;
        }
      }

      entryList.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('[data-remove-id]');
        if (!removeBtn) return;

        const id = removeBtn.dataset.removeId;
        entries = entries.filter((entry) => entry.id !== id);

        saveEntries();
        renderEntries();
        updateControls();
        setStatus('Usunięto tytuł z listy.');
      });

      compareCards.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;

        const card = e.target.closest('.card');
        if (!card || !resolveChoice) return;

        const id = card.dataset.id;
        const winner = currentA?.id === id ? currentA : currentB;

        if (!winner) return;

        const resolver = resolveChoice;
        resolveChoice = null;
        resolver(winner);
      });

      function chooseTie() {
        if (!resolveChoice) return;
        const resolver = resolveChoice;
        resolveChoice = null;
        resolver('tie');
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);
      }

      function createEntry(name) {
        return {
          id: uid(),
          name: name.trim(),
          coverUrl: '',
          infoUrl: malSearchUrl(name.trim()),
          status: 'pending',
          matchedTitle: '',
          source: '',
          score: '',
          scoreSource: ''
        };
      }

      function normalizeTitle(value = '') {
        return String(value)
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim()
          .replace(/[^\p{L}\p{N}\s]/gu, ' ')
          .replace(/\s+/g, ' ');
      }

      function getSearchQueries(rawTitle) {
        const queries = [];
        const add = (q) => {
          const trimmed = q?.trim();
          if (trimmed && trimmed.length >= 2 && !queries.includes(trimmed)) {
            queries.push(trimmed);
          }
        };

        add(rawTitle);

        const noAccents = rawTitle.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        add(noAccents);

        const noSeason = noAccents
          .replace(/\b(\d+(st|nd|rd|th)?\s+season|season\s+\d+|part\s+\d+|cour\s+\d+)\b/gi, ' ')
          .replace(/\s+/g, ' ');
        add(noSeason);

        const beforePunct = noAccents.split(/[:\-\~|/()\[\]]/)[0];
        add(beforePunct);

        const clean = noAccents.replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ');
        add(clean);

        const words = clean.split(' ').filter(Boolean);
        if (words.length > 3) {
          add(words.slice(0, 3).join(' '));
        }

        return queries;
      }

      function setStatus(text = '') {
        statusEl.textContent = text;
      }

      function setError(text = '') {
        errorBox.hidden = !text;
        errorBox.classList.toggle('hidden', !text);
        errorBox.textContent = text;
      }

      function showSection(el) {
        el.hidden = false;
        el.classList.remove('hidden');
      }

      function hideSection(el) {
        el.hidden = true;
        el.classList.add('hidden');
      }

      function addTitles() {
        const raw = titlesInput.value.trim();

        if (!raw) {
          setStatus('Wklej najpierw listę tytułów.');
          return;
        }

        const lines = raw
          .split(/\r?\n/)
          .flatMap((line) => line.split(';'))
          .map((line) => line.trim())
          .filter(Boolean);

        let added = 0;

        for (const name of lines) {
          const isDuplicate = entries.some(
            (entry) => normalizeTitle(entry.name) === normalizeTitle(name)
          );

          if (!isDuplicate) {
            entries.push(createEntry(name));
            added += 1;
          }
        }

        titlesInput.value = '';

        saveEntries();
        renderEntries();
        updateControls();

        if (added > 0) {
          if (isFetching) {
            setStatus(`Dodano ${added} tytułów. Trwa już pobieranie okładek.`);
          } else {
            setStatus(`Dodano ${added} tytułów. Pobieranie okładek i ocen...`);
            fetchAllCovers();
          }
        } else {
          setStatus('Nie dodano nowych tytułów. Wszystko było już na liście albo lista była pusta.');
        }
      }

      async function fetchAllCovers() {
        if (isFetching) return;

        if (!entries.length) {
          setStatus('Najpierw dodaj tytuły.');
          return;
        }

        const missing = entries.filter((entry) => entry.status !== 'ok');

        if (!missing.length) {
          setStatus('Wszystkie okładki i oceny są już pobrane.');
          return;
        }

        isFetching = true;
        updateControls();
        setError('');
        setStatus('Pobieranie okładek i ocen...');

        for (const entry of entries) {
          if (entry.status === 'ok') continue;

          entry.status = 'loading';
          renderEntries();
          updateControls();

          try {
            const result = await getCoverForTitle(entry.name);

            entry.coverUrl = result.coverUrl || '';
            entry.infoUrl = result.infoUrl || entry.infoUrl || malSearchUrl(entry.name);
            entry.matchedTitle = result.matchedTitle || '';
            entry.source = result.source || '';
            entry.score = result.score || '';
            entry.scoreSource = result.scoreSource || '';
            entry.status = 'ok';
          } catch (err) {
            console.warn(`Nie udało się pobrać danych dla: ${entry.name}`, err);

            entry.coverUrl = '';
            entry.status = 'error';
            entry.infoUrl = entry.infoUrl || malSearchUrl(entry.name);
          }

          saveEntries();
          renderEntries();

          await sleep(400);
        }

        isFetching = false;
        updateControls();
        renderEntries();
        setStatus('Zakończono pobieranie okładek i ocen.');
      }

      async function getCoverForTitle(title) {
        const cached = readCoverCache(title);

        if (cached && (cached.coverUrl || cached.score)) {
          return cached;
        }

        let coverUrl = '';
        let infoUrl = '';
        let matchedTitle = '';
        let source = '';
        let score = '';
        let scoreSource = '';
        const errors = [];

        // 1. AniList (Okładka + Ocena)
        try {
          const anilistResult = await fetchAnilistData(title);
          if (anilistResult.coverUrl) {
            coverUrl = anilistResult.coverUrl;
            source = 'AniList';
          }
          if (anilistResult.infoUrl) infoUrl = anilistResult.infoUrl;
          if (anilistResult.matchedTitle) matchedTitle = anilistResult.matchedTitle;
          if (anilistResult.score) {
            score = anilistResult.score;
            scoreSource = 'AniList';
          }
        } catch (err) {
          errors.push('AniList: ' + (err?.message || err));
        }

        // 2. Kitsu (Okładka jeśli brak + Ocena jako fallback)
        if (!coverUrl || !score) {
          try {
            await sleep(250);
            const kitsuResult = await fetchKitsuData(title);
            if (!coverUrl && kitsuResult.coverUrl) {
              coverUrl = kitsuResult.coverUrl;
              source = 'Kitsu';
            }
            if (!infoUrl) infoUrl = kitsuResult.infoUrl;
            if (!matchedTitle) matchedTitle = kitsuResult.matchedTitle;
            if (!score && kitsuResult.score) {
              score = kitsuResult.score;
              scoreSource = 'Kitsu';
            }
          } catch (err) {
            errors.push('Kitsu: ' + (err?.message || err));
          }
        }

        // 3. MyAnimeList (Jikan) - jako fallback dla samej okładki
        if (!coverUrl) {
          try {
            await sleep(350);
            const jikanResult = await fetchJikanCover(title);
            if (jikanResult.coverUrl) {
              coverUrl = jikanResult.coverUrl;
              source = jikanResult.source;
            }
            if (!infoUrl) infoUrl = jikanResult.infoUrl;
            if (!matchedTitle) matchedTitle = jikanResult.matchedTitle;
          } catch (err) {
            errors.push('MyAnimeList: ' + (err?.message || err));
          }
        }

        if (!coverUrl && !matchedTitle && !score) {
          throw new Error(errors.join(' | '));
        }

        const result = {
          coverUrl,
          infoUrl: infoUrl || malSearchUrl(title),
          matchedTitle: matchedTitle || title,
          source: source || 'AniList',
          score,
          scoreSource
        };

        writeCoverCache(title, result);
        return result;
      }

      async function fetchAnilistData(title) {
        const queries = getSearchQueries(title);
        let lastError = null;

        for (const q of queries.slice(0, 3)) {
          try {
            const query = `
              query ($search: String) {
                Media(search: $search) {
                  id
                  siteUrl
                  averageScore
                  meanScore
                  title {
                    romaji
                    english
                    native
                  }
                  coverImage {
                    large
                    medium
                  }
                }
              }
            `;

            const res = await fetchWithTimeout('https://graphql.anilist.co', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                query,
                variables: { search: q }
              })
            });

            if (!res.ok) continue;

            const json = await res.json();
            const media = json?.data?.Media;

            if (!media) continue;

            const coverUrl = media.coverImage?.large || media.coverImage?.medium || '';
            const scoreVal = media.averageScore || media.meanScore;
            const score = scoreVal ? `${scoreVal}%` : '';

            return {
              coverUrl,
              infoUrl: media.siteUrl || anilistSearchUrl(title),
              matchedTitle:
                media.title?.romaji ||
                media.title?.english ||
                media.title?.native ||
                title,
              score
            };
          } catch (err) {
            lastError = err;
          }
        }

        throw lastError || new Error('Brak wyników w AniList.');
      }

      async function fetchKitsuData(title) {
        const queries = getSearchQueries(title);
        let lastError = null;

        for (const q of queries.slice(0, 3)) {
          try {
            const params = new URLSearchParams({
              'filter[text]': q,
              'page[limit]': '3'
            });

            const url = `https://kitsu.io/api/edge/anime?${params.toString()}`;
            const res = await fetchWithTimeout(url, {
              headers: { 'Accept': 'application/vnd.api+json' }
            });

            if (!res.ok) continue;

            const json = await res.json();
            const list = Array.isArray(json.data) ? json.data : [];
            if (!list.length) continue;

            const item = list[0];
            const attrs = item.attributes || {};

            const coverUrl =
              attrs.posterImage?.original ||
              attrs.posterImage?.large ||
              attrs.posterImage?.medium ||
              attrs.posterImage?.small ||
              attrs.posterImage?.tiny ||

            };
          } catch (err) {

        }

        for (const q of queries.slice(0, 3)) {
          try {

              'filter[text]': q,
              'page[limit]': '3'
            });

            const url = `https://kitsu.io/api/edge/manga?${params.toString()}`;
            const res = await fetchWithTimeout(url, {
              headers: { 'Accept': 'application/vnd.api+json' }
            });

            if (!res.ok) continue;

            const json = await res.json();
            const list = Array.isArray(json.data) ? json.data : [];
            if (!list.length) continue;

            const item = list[0];
            const attrs = item.attributes || {};

            const coverUrl =
              attrs.posterImage?.original ||
              attrs.posterImage?.large ||
              attrs.posterImage?.medium ||
              attrs.posterImage?.small ||
              attrs.posterImage?.tiny ||
              '';

            const matchedTitle =
              attrs.canonicalTitle ||
              attrs.titles?.en ||
              attrs.titles?.en_jp ||
              title;

            const infoUrl = attrs.slug
              ? `https://kitsu.io/manga/${attrs.slug}`
              : `https://kitsu.io/manga?text=${encodeURIComponent(title)}`;

            let score = '';
            if (attrs.averageRating && !isNaN(attrs.averageRating)) {
              score = `${Math.round(Number(attrs.averageRating))}%`;
            }

            return {
              coverUrl,

        throw lastError || new Error('Brak wyników w Kitsu.');

      async function fetchJikanWithRetry(url, retries = 2) {
        for (let i = 0; i <= retries; i++) {
          try {
            const res = await fetchWithTimeout(url, { headers: { 'Accept': 'application/json' } }, 12000);
            if (res.status === 429) {
              await sleep(1500 * (i + 1));
              continue;
            }
            if (!res.ok) return null;
            const json = await res.json();
            return Array.isArray(json.data) ? json.data : [];
          } catch (err) {
            if (i === retries) return null;
            await sleep(1000);
          }
        }
        return null;
      }

      async function fetchJikanCover(title) {
        const queries = getSearchQueries(title);
        let bestItem = null;
        let isManga = false;

        for (const q of queries.slice(0, 2)) {
          const url = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=5`;
          const data = await fetchJikanWithRetry(url);
          if (data && data.length) {
            const item = chooseBestJikanResult(data, title);
            if (item) {
              bestItem = item;
              break;
            }
          }
          await sleep(350);
        }

        if (!bestItem) {
          for (const q of queries.slice(0, 2)) {
            const url = `https://api.jikan.moe/v4/manga?q=${encodeURIComponent(q)}&limit=5`;
            const data = await fetchJikanWithRetry(url);
            if (data && data.length) {
              const item = chooseBestJikanResult(data, title);
              if (item) {
                bestItem = item;
                isManga = true;
                break;
              }
            }
            await sleep(350);
          }
        }

        if (!bestItem) {
          throw new Error('Brak wyników w MyAnimeList.');
        }

        const coverUrl = getJikanImageUrl(bestItem);

        return {
          coverUrl,
          infoUrl: bestItem.url || malSearchUrl(title),
          matchedTitle: bestItem.title || title,
          source: isManga ? 'MyAnimeList (manga)' : 'MyAnimeList'
        };
      }

      function getJikanImageUrl(item) {
        return (
          item.images?.webp?.large_image_url ||
          item.images?.jpg?.large_image_url ||
          item.images?.webp?.image_url ||
          item.images?.jpg?.image_url ||
          ''
        );
      }

      function chooseBestJikanResult(list, query) {
        if (!list || !list.length) return null;

        const normalizedQuery = normalizeTitle(query);

        const getTitles = (item) => {
          const titles = [
            item.title,
            item.title_english,
            item.title_romaji,
            item.title_japanese
          ];

          if (Array.isArray(item.titles)) {
            for (const titleObj of item.titles) {
              if (titleObj && titleObj.title) {
                titles.push(titleObj.title);
              }
            }
          }

          return titles.filter(Boolean);
        };

        const exactMatch = list.find((item) =>
          getTitles(item).some((t) => normalizeTitle(t) === normalizedQuery)
        );
        if (exactMatch) return exactMatch;

        const startsWithMatch = list.find((item) =>
          getTitles(item).some((t) => {
            const nt = normalizeTitle(t);
            return nt.startsWith(normalizedQuery) || normalizedQuery.startsWith(nt);
          })
        );
        if (startsWithMatch) return startsWithMatch;

        const includesMatch = list.find((item) =>
          getTitles(item).some((t) => {
            const nt = normalizeTitle(t);
            return nt.includes(normalizedQuery) || normalizedQuery.includes(nt);
          })
        );
        if (includesMatch) return includesMatch;

        return list[0];
      }

      async function fetchWithTimeout(url, options = {}, timeout = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);

        try {
          return await fetch(url, {
            ...options,
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeoutId);
        }
      }

      function coverCacheKey(title) {
        return COVER_CACHE_PREFIX + normalizeTitle(title);
      }

      function readCoverCache(title) {
        try {
          const raw = localStorage.getItem(coverCacheKey(title));
          if (!raw) return null;

          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.coverUrl) return null;

          return parsed;
        } catch (err) {
          console.warn('Błąd odczytu cache okładki:', err);
          return null;
        }
      }

      function writeCoverCache(title, data) {
        try {
          localStorage.setItem(coverCacheKey(title), JSON.stringify(data));
        } catch (err) {
          console.warn('Nie udało się zapisać cache okładki:', err);
        }
      }

      function clearCoverCache() {
        if (!entries.length) {
          setStatus('Lista jest pusta — nie ma czego czyścić.');
          return;
        }

        const keysToRemove = [];

        try {
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);

            if (key && key.startsWith(COVER_CACHE_PREFIX)) {
              keysToRemove.push(key);
            }
          }

          for (const key of keysToRemove) {
            localStorage.removeItem(key);
          }
        } catch (err) {
          console.warn('Nie udało się wyczyścić cache okładek:', err);
        }

        entries = entries.map((entry) => ({
          ...entry,
          coverUrl: '',
          status: 'pending',
          matchedTitle: '',
          source: '',
          score: '',
          scoreSource: '',
          infoUrl: malSearchUrl(entry.name)
        }));

        saveEntries();
        renderEntries();
        updateControls();

        setStatus(`Usunięto cache okładek: ${keysToRemove.length}. Możesz teraz kliknąć „Pobierz okładki”.`);
      }

      function saveEntries() {
        try {
          const serialized = entries.map((entry) => ({
            ...entry,
            status: entry.status === 'loading' ? 'pending' : entry.status
          }));

          localStorage.setItem(STORAGE_KEY, JSON.stringify(serialized));
        } catch (err) {
          console.warn('Nie udało się zapisać listy tytułów:', err);
        }
      }

      function loadEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return;

          entries = parsed
            .filter((item) => item && typeof item.name === 'string' && item.name.trim())
            .map((item) => ({
              id: String(item.id || uid()),
              name: item.name.trim(),
              coverUrl: typeof item.coverUrl === 'string' ? item.coverUrl : '',
              infoUrl:
                typeof item.infoUrl === 'string' && item.infoUrl
                  ? item.infoUrl
                  : malSearchUrl(item.name.trim()),
              status:
                item.status === 'ok'
                  ? 'ok'
                  : item.status === 'error'
                    ? 'error'
                    : 'pending',
              matchedTitle: typeof item.matchedTitle === 'string' ? item.matchedTitle : '',
              source: typeof item.source === 'string' ? item.source : '',
              score: typeof item.score === 'string' ? item.score : '',
              scoreSource: typeof item.scoreSource === 'string' ? item.scoreSource : ''
            }));
        } catch (err) {
          console.warn('Błąd wczytywania listy tytułów:', err);
          entries = [];
        }
      }

      function renderEntries() {
        entryList.innerHTML = '';

        for (const entry of entries) {
          const row = document.createElement('div');
          row.className = 'entry-item';

          row.innerHTML = `
            <img class="entry-thumb" src="${escapeHtml(entry.coverUrl || PLACEHOLDER_COVER)}" alt="" />

            <div>
              <div class="entry-title">${escapeHtml(entry.name)}</div>
              <div class="muted">
                ${escapeHtml(statusLabel(entry.status))}
                ${entry.source ? ' • ' + escapeHtml(entry.source) : ''}
              </div>
            </div>

            <div class="entry-actions">
              <a
                href="${escapeHtml(entry.infoUrl || malSearchUrl(entry.name))}"
                target="_blank"
                rel="noopener"
              >Info</a>

              <button class="danger" data-remove-id="${entry.id}">Usuń</button>
            </div>
          `;

          const img = row.querySelector('img');

          img.addEventListener('error', () => {
            img.src = PLACEHOLDER_COVER;
          });

          entryList.appendChild(row);
        }
      }

      function statusLabel(status) {
        const labels = {
          pending: 'Oczekuje na okładkę',
          loading: 'Pobieranie okładki i ocen...',
          ok: 'OK',
          error: 'Nie pobrano okładki'
        };

        return labels[status] || status;
      }

      function updateControls() {
        addBtn.disabled = false;
        fetchCoversBtn.disabled = isFetching || entries.length === 0;
        clearCoverCacheBtn.disabled = isFetching || entries.length === 0;
        clearListBtn.disabled = isFetching || entries.length === 0;
        startBtn.disabled = isFetching || entries.length < 2;

        const missingCovers = entries.filter((entry) => entry.status !== 'ok').length;

        if (!entries.length) {
          entriesMeta.textContent = 'Lista jest pusta.';
          return;
        }

        entriesMeta.textContent =
          `Liczba tytułów: ${entries.length}` +
          (missingCovers ? ` • tytuły bez pobranej okładki: ${missingCovers}` : '');
      }

      function clearList() {
        if (!entries.length) return;

        if (!confirm('Na pewno chcesz wyczyścić całą listę tytułów?')) return;

        entries = [];

        saveEntries();
        renderEntries();
        updateControls();
        setStatus('Lista została wyczyszczona.');
      }

      async function startRanking() {
        if (entries.length < 2) return;

        compareCancelled = false;
        compareCount = 0;

        setError('');
        setStatus('');
        progressBar.style.width = '0%';

        hideSection(setup);
        hideSection(resultView);
        showSection(compareView);

        try {
          const initialClusters = entries.map((entry) => [entry]);
          const rankedClusters = await mergeSort(initialClusters);

          progressBar.style.width = '100%';
          renderRanking(rankedClusters);

          hideSection(compareView);
          showSection(resultView);
        } catch (err) {
          if (err && err.name === 'CancelledError') {
            showSetup();
            return;
          }

          console.error(err);

          hideSection(compareView);
          showSection(setup);

          setError('Błąd podczas porównywania: ' + (err?.message || err));
        }
      }

      function cancelCompare() {
        compareCancelled = true;

        if (resolveChoice) {
          const resolver = resolveChoice;
          resolveChoice = null;
          resolver(null);
        }

        showSetup();
      }

      function showSetup() {
        showSection(setup);
        hideSection(compareView);
        hideSection(resultView);

        setStatus('');
        setError('');
        updateControls();
      }

      async function mergeSort(clusters) {
        if (clusters.length <= 1) return clusters;

        const middle = Math.floor(clusters.length / 2);

        const left = await mergeSort(clusters.slice(0, middle));
        const right = await mergeSort(clusters.slice(middle));

        return merge(left, right);
      }

      async function merge(left, right) {
        const result = [];

        let i = 0;
        let j = 0;

        while (i < left.length && j < right.length) {
          if (compareCancelled) {
            throw new CancelledError();
          }

          const choice = await askCompare(left[i][0], right[j][0]);

          if (!choice) {
            throw new CancelledError();
          }

          if (choice === 'tie') {
            result.push([...left[i], ...right[j]]);
            i += 1;
            j += 1;
          } else if (choice.id === left[i][0].id) {
            result.push(left[i]);
            i += 1;
          } else {
            result.push(right[j]);
            j += 1;
          }
        }

        return result.concat(left.slice(i)).concat(right.slice(j));
      }

      function askCompare(a, b) {
        currentA = a;
        currentB = b;

        compareCount += 1;

        const estimatedTotal = Math.max(1, Math.round(entries.length * Math.log2(entries.length)));
        const percent = Math.min(99, Math.round(((compareCount - 1) / estimatedTotal) * 100));

        progressBar.style.width = `${percent}%`;
        compareCounter.textContent = `Porównanie #${compareCount} • Postęp: ~${percent}% • Tytułów na liście: ${entries.length}`;

        renderCompareCard(cardA, a);
        renderCompareCard(cardB, b);

        return new Promise((resolve) => {
          resolveChoice = resolve;
        });
      }

      function renderCompareCard(card, entry) {
        card.dataset.id = entry.id;

        const matched =
          entry.matchedTitle &&
          normalizeTitle(entry.matchedTitle) !== normalizeTitle(entry.name)
            ? `Dopasowano: ${escapeHtml(entry.matchedTitle)}<br />`
            : '';

        card.innerHTML = `
          <img src="${escapeHtml(entry.coverUrl || PLACEHOLDER_COVER)}" alt="" />
          <h3>${escapeHtml(entry.name)}</h3>
          <p class="muted">
            ${matched}
            <a
              href="${escapeHtml(entry.infoUrl || malSearchUrl(entry.name))}"
              target="_blank"
              rel="noopener"
            >Info</a>
          </p>
        `;

        const img = card.querySelector('img');

        img.addEventListener('error', () => {
          img.src = PLACEHOLDER_COVER;
        });
      }

      function renderRanking(clusters) {
        rankList.innerHTML = '';
        let currentRank = 1;

        clusters.forEach((cluster) => {
          const rankForThisCluster = currentRank;

          cluster.forEach((entry) => {
            const row = document.createElement('div');
            row.className = 'ranking-item';

            let scoreText = '';
            if (entry.score) {
              const sourceLabel = entry.scoreSource || 'AniList';
              scoreText = ` • ${escapeHtml(sourceLabel)}: ★ ${escapeHtml(entry.score)}`;
            }

            row.innerHTML = `
              <div class="rank-number">${rankForThisCluster}.</div>

              <img src="${escapeHtml(entry.coverUrl || PLACEHOLDER_COVER)}" alt="" />

              <div>
                <strong>${escapeHtml(entry.name)}</strong>
                <div class="muted">
                  <a
                    href="${escapeHtml(entry.infoUrl || malSearchUrl(entry.name))}"
                    target="_blank"
                    rel="noopener"
                  >Info</a>${scoreText}
                </div>
              </div>
            `;

            const img = row.querySelector('img');

            img.addEventListener('error', () => {
              img.src = PLACEHOLDER_COVER;
            });

            rankList.appendChild(row);
          });

          currentRank += cluster.length;
        });
      }

      function malSearchUrl(title) {
        return `https://myanimelist.net/search/all?q=${encodeURIComponent(title)}`;
      }

      function anilistSearchUrl(title) {
        return `https://anilist.co/search/anime?search=${encodeURIComponent(title)}`;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function escapeHtml(value = '') {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }
    })();
  </script>
